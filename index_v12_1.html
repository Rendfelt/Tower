<style>

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-family:"Alegreya SC",Georgia,serif;font-size:22px;margin:0;line-height:1.35;min-width:1040px;background:var(--night);color:var(--ink);padding:18px 20px 28px;background-image:radial-gradient(ellipse at 50% 100%,rgba(46,178,232,.46) 0%,rgba(12,84,126,.38) 28%,transparent 58%),radial-gradient(circle at 72% 8%,rgba(104,214,255,.3),transparent 26%),radial-gradient(circle at 12% 18%,rgba(216,177,92,.14),transparent 22%),repeating-linear-gradient(112deg,rgba(220,250,255,.045) 0 1px,transparent 1px 42px),repeating-linear-gradient(68deg,rgba(0,24,42,.24) 0 2px,transparent 2px 58px),linear-gradient(180deg,#020912 0%,#07324b 46%,#020b12 100%);background-attachment:fixed;background-size:auto,auto,auto,180px 180px,220px 220px,auto}
.top-area{width:1040px;position:relative}
.corner-logo{position:absolute;right:0;top:0;width:180px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65));pointer-events:none}
p{margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wrap{display:flex;gap:20px;align-items:flex-start;margin:14px 0 8px;width:1040px;position:relative;min-height:0}
details.panel{width:300px;margin-bottom:12px;background:linear-gradient(180deg,rgba(13,91,135,.95),rgba(3,22,36,.98));border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(218,249,255,.14)}

.fixed-submenu{position:absolute;left:0;top:calc(100% + 5px);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-width:220px;padding:7px;border:1px solid rgba(166,231,255,.6);border-radius:8px;background:linear-gradient(180deg,#0b3f5e,#021827);box-shadow:0 12px 30px rgba(0,0,0,.55)}

details.panel summary{cursor:pointer;font-family:"Alegreya SC",Georgia,serif;font-weight:bold;margin:4px 0;padding:6px 2px;color:#fff;text-transform:uppercase;letter-spacing:0;text-shadow:0 0 8px rgba(85,199,242,.85)}
details.panel[open] summary{margin-bottom:8px;border-bottom:1px solid rgba(174,232,255,.38)}
#field{width:1000px;height:1000px;border:2px solid #63c9f2;border-radius:10px;position:relative;overflow:hidden;touch-action:auto;background:#051b2a;background-image:radial-gradient(ellipse at 50% 42%,rgba(70,188,235,.4) 0%,rgba(10,86,132,.28) 28%,transparent 62%),radial-gradient(ellipse at 50% 110%,rgba(216,177,92,.14),transparent 42%),linear-gradient(180deg,#0b314a 0%,#051b2a 52%,#020b12 100%);background-size:100% 100%;box-shadow:0 0 0 1px rgba(223,250,255,.14),0 8px 28px rgba(0,0,0,.55),inset 0 0 120px rgba(0,8,18,.7)}
#field::before{content:"";position:absolute;inset:0;background:url("https://bloodontheclocktower.com/cdn/shop/files/2BloodLogo_2_1.png?v=1758698292&width=2400") center 54%/78% auto no-repeat;opacity:.08;filter:saturate(.95) brightness(.9);mix-blend-mode:screen;pointer-events:none}
#field::after{content:"";position:absolute;inset:14px;border-radius:8px;background:radial-gradient(circle at 50% 0%,rgba(116,221,255,.18),transparent 24%),radial-gradient(circle at 18% 26%,rgba(67,184,232,.16),transparent 28%),radial-gradient(circle at 82% 38%,rgba(120,218,255,.12),transparent 26%),radial-gradient(circle at 42% 78%,rgba(23,125,184,.22),transparent 32%);box-shadow:inset 0 0 38px rgba(85,199,242,.12);pointer-events:none}
.field-wrap{padding:0 20px;box-sizing:content-box;width:1000px}
.person{border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,rgba(218,249,255,.16),rgba(10,77,116,.68));color:var(--ink);padding:10px;margin:10px 0;position:relative;width:270px;box-shadow:0 5px 14px rgba(0,0,0,.32),inset 0 0 0 1px rgba(218,249,255,.14)}
.person b{display:block;margin-bottom:3px}
.drop{display:none;position:absolute;left:8px;top:34px;background:#fff;border:1px solid #999;padding:8px;z-index:10}
.drop label{display:block}
.card{position:absolute;min-width:148px;background:#dfefff;border:1px solid #5b7ea5;border-radius:8px;padding:10px 11px;touch-action:none;user-select:none;font-family:"Alegreya SC",Georgia,serif;font-size:18px;box-shadow:0 5px 14px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.25);color:#1d1713}
.card.color-blue{background:linear-gradient(180deg,#d8f5ff,#8bcbe3);border-color:#4d9fc0}
.card.color-red{background:linear-gradient(180deg,#f2c6d0,#bb596a);border-color:#873040}
.card.color-green{background:linear-gradient(180deg,#d5eccb,#78a765);border-color:#4c743b}
.card.color-yellow{background:linear-gradient(180deg,#fff3bc,#d9bc61);border-color:#9b7a2f}
.card.dead{background:linear-gradient(180deg,#c7c2b7,#7e7770);border-color:#3f3936;color:#2e2b28;box-shadow:0 3px 9px rgba(0,0,0,.35)}
.card.nomination-source{background:linear-gradient(180deg,#f4dda2,#c69a36);border-color:#7f5515}
.card.nomination-target{cursor:pointer;box-shadow:0 0 0 2px rgba(11,107,47,.35)}
.card.conversation-source{background:linear-gradient(180deg,#d7edff,#78a9d8);border-color:#3b6f9c}
.card.conversation-target{cursor:pointer;box-shadow:0 0 0 2px rgba(83,180,255,.4)}
.card.conversation-selected{box-shadow:0 0 0 3px rgba(255,208,51,.85),0 8px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.35)}
.card.vote-target{background:linear-gradient(180deg,#ffe98f,#d18b1f);border-color:#fff3a8;box-shadow:0 0 0 3px rgba(255,232,120,.8),0 8px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.35)}
.card.vote-voter{cursor:pointer;box-shadow:0 0 0 2px rgba(169,68,68,.35)}
.card.vote-done{cursor:default;opacity:.75}
.log-selected .card{opacity:.45;filter:saturate(.72)}
.log-selected .card.log-highlighted{opacity:1;filter:none;box-shadow:var(--log-rings),0 0 26px rgba(255,208,51,.42),0 8px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.35)}
.vote-count{font-size:18px;font-weight:bold;color:#a94444;margin-bottom:4px}
.event-hint{width:1000px;box-sizing:border-box;margin:8px 20px 10px;padding:10px 12px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(180deg,#f4d36f,#8f5b16);color:#1c0f05;display:none;box-shadow:0 5px 14px rgba(0,0,0,.32)}
.card b{display:block;border-bottom:1px solid rgba(0,0,0,.2);margin-bottom:5px;padding-bottom:3px;font-family:"Gabriela",Georgia,serif;font-size:22px;font-weight:bold;color:#130c15;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.role-confirmed{font-weight:bold;color:#1f7d36}
.role-crossed{text-decoration:line-through;color:#7c7161}
.panel .role-confirmed,.menu .role-confirmed{color:#78d084}
.panel .role-crossed,.menu .role-crossed{color:#8e8068}
.role-owners{font-size:18px;color:var(--muted);margin:2px 0 8px 16px}
.menu{display:none;position:absolute;background:linear-gradient(180deg,#0b3f5e,#021827);border:1px solid rgba(166,231,255,.6);border-radius:8px;padding:7px;z-index:1000;box-shadow:0 12px 30px rgba(0,0,0,.55);width:420px;max-width:calc(1000px - 8px);overflow-x:hidden;color:var(--ink)}
.menu button{display:block;width:100%;min-height:46px;margin:3px 0;font-family:"Alegreya SC",Georgia,serif;font-size:21px;font-weight:normal;text-transform:none;text-shadow:none;padding:10px 12px;text-align:left;background:transparent;border-color:transparent;color:#fff8ee}
.menu button:active{background:rgba(255,255,255,.08)}
.menu label{display:block;margin:8px 0;}
.role-check{display:flex!important;align-items:flex-start;gap:10px;min-height:44px;font-size:21px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.role-check input{flex:0 0 auto;width:24px;height:24px}
.role-row{display:flex;align-items:flex-start;gap:8px;margin:6px 0;position:relative}
.role-row button{min-height:40px;font-size:20px;padding:7px 12px}
.role-menu{display:none;position:absolute;left:0;top:44px;background:linear-gradient(180deg,#0b3f5e,#021827);border:1px solid rgba(166,231,255,.6);border-radius:8px;padding:7px;z-index:20;box-shadow:0 8px 18px rgba(0,0,0,.5);min-width:190px}
.role-menu button{display:block;width:100%;min-height:44px;font-family:"Alegreya SC",Georgia,serif;font-size:20px;font-weight:normal;text-transform:none;text-shadow:none;padding:10px 12px;margin:3px 0;text-align:left;background:transparent;border-color:transparent;color:#fff8ee}
input,button,select{font-family:"Alegreya SC",Georgia,serif;font-size:20px;border:1px solid var(--line);border-radius:8px;background:#031927;color:var(--ink);padding:9px 10px}
input::placeholder{color:#9ed9ef}
select option{background:#031927;color:var(--ink)}
button{cursor:pointer;font-family:"Alegreya SC",Georgia,serif;background:linear-gradient(180deg,var(--purple3),var(--purple2) 48%,var(--purple));color:#fff;text-transform:uppercase;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,.65)}
button:active{transform:translateY(1px)}
button,select,summary,label{outline:none;-webkit-touch-callout:none}
button:focus,button:focus-visible,select:focus,select:focus-visible,summary:focus,summary:focus-visible{outline:none}
input:focus{outline:2px solid rgba(234,208,146,.42);outline-offset:1px}
ul{margin:0;padding-left:22px}
body *{user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text}
input:focus{outline:2px solid rgba(116,221,255,.48);outline-offset:1px}
</style><body>

<div class=top-area><img class=corner-logo src="https://bloodontheclocktower.com/cdn/shop/files/logo_3.png" alt="">
<p><input id=pname placeholder="Имя"><button onclick="addPerson()">Добавить игрока</button></p>
<p><button onclick="exportJson()">Экспорт</button>
<button onclick="openImport()">Импорт</button>
<button onclick="resetState()">Сброс</button>
<input id="imp" type=file accept=".json" hidden></p></div>

<div class=wrap><details class=panel><summary>Игроки</summary><div id=plist></div></details></div>
<div id=eventHint class=event-hint></div><div class=field-wrap><div id=field></div></div><details class="panel log-panel" open><summary>Лог</summary><div class=logcomposer><input id=logTextInput placeholder="Событие" onkeydown="if(event.key==='Enter')addCustomLogEvent()"><select id=logInsertPlayer onchange="insertLogPlayer()"></select><button onclick="addCustomLogEvent()">Добавить</button></div><div class=fixed-events><button onclick="addGovernmentFixedLog('выложили синюю')">Выложили синюю</button><button onclick="addGovernmentFixedLog('выложили красную')">Выложили красную</button><button onclick="addDeckShuffleLog()">Шаффл колоды</button><span class=fixed-claim><button onclick="toggleBlueClaimMenu(event)">Заявили синих</button><span id=blueClaimMenu class=fixed-submenu hidden><button onclick="addBlueClaim(0)">0</button><button onclick="addBlueClaim(1)">1</button><button onclick="addBlueClaim(2)">2</button><button onclick="addBlueClaim(3)">3</button></span></span></div><div class=logfilters><select id=logPlayerFilter onchange="renderLog()"></select></div><div id=loglist class=logbox></div></details>

<script>
const KEY="mafia-demo-state";
let people=[],roles=[],logs=[],pid=1,rid=1,dayNumber=0,blueClaimCount=0,nominationSourceId=null,votingTargetId=null,votingLogId=null,conversationSourceId=null,conversationTargetIds=[],selectedLogIndex=null;
const $=id=>document.getElementById(id);
const rn=id=>roles.find(r=>r.id===id)?.name||"?";
const rc=id=>people.filter(p=>p.roles.includes(id) && !roleIsCrossed(p,id)).length;
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
function normalizePeople(){people.forEach(p=>{p.roles=p.roles||[];p.dead=!!p.dead;p.color=["blue","red","green","yellow"].includes(p.color)?p.color:"blue";p.confirmedRoles=(p.confirmedRoles||[]).filter(id=>p.roles.includes(id));});}
function roleConfirmedByOther(person,id){return people.some(p=>p.id!==person.id && (p.confirmedRoles||[]).includes(id));}
function roleIsConfirmed(id){return people.some(p=>(p.confirmedRoles||[]).includes(id));}
function roleIsCrossed(person,id){
 const confirmed=person.confirmedRoles||[];
 return roleConfirmedByOther(person,id) || (confirmed.length>0 && !confirmed.includes(id));
}
function activeRoleOwners(id){return people.filter(p=>p.roles.includes(id) && !roleIsCrossed(p,id));}
function roleListHtml(role){
 const owners=activeRoleOwners(role.id).map(p=>esc(p.name)).join(", ");
 const mark=roleIsConfirmed(role.id)?"<span class=\"role-confirmed\">✓</span> ":"";
 return `${mark}${esc(role.name)} (${rc(role.id)})${owners?`<div class="role-owners">${owners}</div>`:""}`;
}
function roleHtml(person,id){
 const name=esc(rn(id));
 if((person.confirmedRoles||[]).includes(id))return `<span class="role-confirmed">✓ ${name}</span>`;
 if(roleIsCrossed(person,id))return `<span class="role-crossed">${name}</span>`;
 return name;
}
function personRolesHtml(person){return person.roles.map(id=>roleHtml(person,id)).join("<br>")||"<i>нет ролей</i>";}
function cardRolesHtml(person){return person.roles.map(id=>roleHtml(person,id)).join("<br>");}
function cardHtml(person,votes){
 return "<b>"+playerTitle(person)+(votes.includes(person.id)?" ✋":"")+"</b>"
   +(person.id===votingTargetId?`<div class="vote-count">Голосов: ${votes.length}</div>`:"");
}
function refreshRoleViews(){
 const votes=currentVotes();
 document.querySelectorAll(".person").forEach(box=>{
   const person=people.find(p=>p.id===+box.dataset.id);
   if(person)box.innerHTML=`<b>${playerTitle(person)}</b>`;
 });
 document.querySelectorAll(".card").forEach(card=>{
   const person=people.find(p=>p.id===+card.dataset.id);
   if(person){
     const menu=card.querySelector(".menu");
     card.innerHTML=cardHtml(person,votes);
     if(menu)card.append(menu);
   }
 });
 renderLog();
}
function save(){localStorage.setItem(KEY,JSON.stringify({people,roles,logs,pid,rid,dayNumber,blueClaimCount}));}
function logTime(){return new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
function addLog(text){
 logs.push({time:logTime(),text});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function addCustomLog(text,playerIds,roleIds){
 logs.push({type:"custom",time:logTime(),text,playerIds,roleIds});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function addDeathLog(person){
 logs.push({type:"death",time:logTime(),playerId:person.id,dead:person.dead});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function addFixedLog(text){
 logs.push({type:"fixed",time:logTime(),text});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function lastGovernmentPrefix(){
 const nomination=[...logs].reverse().find(log=>log.type==="nomination");
 if(!nomination)return "";
 return `Президент ${playerName(nomination.sourceId)}, канцлер ${playerName(nomination.targetId)}, `;
}
function addGovernmentFixedLog(text){
 addFixedLog(lastGovernmentPrefix()+text);
}
function addDeckShuffleLog(){
 blueClaimCount=0;
 addFixedLog("Шаффл колоды");
}
function blueClaimWord(count){
 if(count===1)return "синюю";
 if(count>=2&&count<=4)return "синие";
 return "синих";
}
function toggleBlueClaimMenu(event){
 event.stopPropagation();
 const menu=$("blueClaimMenu");
 if(!menu)return;
 closeAllMenus();
 closeRoleMenus();
 menu.hidden=!menu.hidden;
}
function addBlueClaim(count){
 const menu=$("blueClaimMenu");
 if(menu)menu.hidden=true;
 blueClaimCount+=count;
 addGovernmentFixedLog(`заявили ${count} ${blueClaimWord(count)} (${blueClaimCount})`);
}
function addNominationLog(sourceId,targetId){
 const log={id:Date.now()+"-"+Math.random().toString(16).slice(2),type:"nomination",time:logTime(),sourceId,targetId,votes:[]};
 logs.push(log);
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
 return log;
}
function addConversationLog(sourceId,targetIds){
 logs.push({type:"conversation",time:logTime(),sourceId,targetIds:[...targetIds]});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function logText(log){
 if(log.type==="custom")return log.text||"";
 if(log.type==="death")return `${playerName(log.playerId)} ${log.dead?"умирает":"оживает"}`;
 if(log.type==="day")return `Новый день ${log.day||""}`.trim();
 if(log.type==="fixed")return log.text||"";
 if(log.type==="conversation")return `${playerName(log.sourceId)} общается с ${(log.targetIds||[]).map(playerName).join(", ")}`;
 if(log.type==="nomination"){
   const source=playerName(log.sourceId);
   const target=playerName(log.targetId);
   const voteIds=log.votes||[];
   const votes=voteIds.map(playerName).join(", ");
   return `${source} номинирует ${target}.${votes?` За ${target} голосуют (${voteIds.length}): ${votes}`:""}`;
 }
 return log.text||"";
}
function logPlayers(log){
 const mentioned=people.filter(p=>p.name&&logText(log).includes(p.name)).map(p=>p.id);
 if(log.type==="custom")return [...new Set([...(log.playerIds||[]),...mentioned])];
 if(log.type==="death")return [log.playerId].filter(id=>id!=null);
 if(log.type==="conversation")return [log.sourceId,...(log.targetIds||[])].filter(id=>id!=null);
 if(log.type==="nomination")return [log.sourceId,log.targetId,...(log.votes||[])].filter(id=>id!=null);
 return mentioned;
}
function logRoles(log){
 if(log.type==="custom")return log.roleIds||[];
 return roles.filter(r=>logText(log).includes(r.name)).map(r=>r.id);
}
function renderComposerOptions(){
 const playerSelect=$("logInsertPlayer");
 if(!playerSelect)return;
 playerSelect.innerHTML='<option value="">+ игрок</option>'+people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
}
function renderLogFilters(){
 const playerFilter=$("logPlayerFilter");
 if(!playerFilter)return;
 const playerValue=playerFilter.value;
 playerFilter.innerHTML='<option value="">Все игроки</option>'+people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
 playerFilter.value=people.some(p=>String(p.id)===playerValue)?playerValue:"";
}
function highlightLogText(text){
 let html=esc(text);
 const isWordChar=ch=>!!ch&&/[A-Za-zА-Яа-яЁё0-9_]/.test(ch);
 const replaceEntity=(source,name,cls)=>{
   const value=esc(name);
   let out="",pos=0;
   while(pos<source.length){
     const idx=source.indexOf(value,pos);
     if(idx<0){out+=source.slice(pos);break;}
     const before=source[idx-1]||"";
     const after=source[idx+value.length]||"";
     out+=source.slice(pos,idx);
     out+=(!isWordChar(before)&&!isWordChar(after))?`<span class="${cls}">${value}</span>`:value;
     pos=idx+value.length;
   }
   return out;
 };
 const playerMarks=[];
 people.forEach((p,i)=>{
   if(!p.name)return;
   const mark=`@@PLAYER_${i}@@`;
   playerMarks.push([mark,`<span class="log-player">${esc(p.name)}</span>`]);
   html=replaceEntity(html,p.name,`PLAYER_MARK_${i}`);
   html=html.split(`<span class="PLAYER_MARK_${i}">${esc(p.name)}</span>`).join(mark);
 });
 playerMarks.forEach(([mark,value])=>{html=html.split(mark).join(value);});
 return html;
}
function hideRoleNames(text){
 let masked=String(text);
 roles.forEach(r=>{
   if(!r.name)return;
   masked=masked.split(r.name).join("[скрыто]");
 });
 return masked;
}
function logMatchesFilters(log){
 if(log.type==="day"||log.type==="fixed")return true;
 const text=hideRoleNames(logText(log)).toLowerCase();
 const player=$("logPlayerFilter")?.value||"";
 if(player&&!logPlayers(log).includes(+player)&&!text.includes(player.toLowerCase()))return false;
 return true;
}
function renderLog(){
 const list=$("loglist");
 if(!list)return;
 const keepTop=list.scrollTop;
 const wasAtBottom=list.scrollTop+list.clientHeight>=list.scrollHeight-10;
 renderComposerOptions();
 renderLogFilters();
 if(selectedLogIndex!=null&&(!logs[selectedLogIndex]||!logMatchesFilters(logs[selectedLogIndex])))selectedLogIndex=null;
 const visibleLogs=logs.map((log,index)=>({log,index})).filter(item=>logMatchesFilters(item.log));
 list.innerHTML=visibleLogs.length
   ?visibleLogs.map(({log,index})=>`<div class="logitem${log.type==="day"||log.type==="fixed"?" fixed-event":""}${index===selectedLogIndex?" selected":""}" onclick="selectLogLine(${index})"><span class="logtime">${esc(log.time)}</span>${highlightLogText(hideRoleNames(logText(log)))}</div>`).join("")
   :'<div class="logempty">Нет событий</div>';
 list.scrollTop=selectedLogIndex==null&&wasAtBottom?list.scrollHeight:keepTop;
}
function selectedLogPlayerIds(){
 if(selectedLogIndex==null || !logs[selectedLogIndex])return [];
 return logPlayers(logs[selectedLogIndex]);
}
function selectedLogRings(){
 const map=new Map();
 if(selectedLogIndex==null || !logs[selectedLogIndex])return map;
 const log=logs[selectedLogIndex];
 const add=(id,color)=>{
   if(id==null)return;
   const rings=map.get(id)||[];
   rings.push(color);
   map.set(id,rings);
 };
 if(log.type==="nomination"){
   add(log.sourceId,"rgba(83,180,255,.95)");
   add(log.targetId,"rgba(214,59,79,.95)");
   (log.votes||[]).forEach(id=>add(id,"rgba(255,208,51,.9)"));
 }else{
   logPlayers(log).forEach(id=>add(id,"rgba(255,208,51,.9)"));
 }
 return map;
}
function ringShadow(colors){
 return colors.map((color,i)=>`0 0 0 ${4+i*5}px ${color}`).join(",");
}
function selectLogLine(index){
 selectedLogIndex=selectedLogIndex===index?null:index;
 render();
}
function filterLogByPlayer(person){
 const playerFilter=$("logPlayerFilter");
 if(!playerFilter)return;
 renderLogFilters();
 playerFilter.value=person.id;
 closeAllMenus();
 renderLog();
}
function insertAtCursor(input,text){
 const start=input.selectionStart||0;
 const end=input.selectionEnd||0;
 input.value=input.value.slice(0,start)+text+input.value.slice(end);
 input.focus();
 input.selectionStart=input.selectionEnd=start+text.length;
}
function currentCustomMeta(){
 const input=$("logTextInput");
 if(!input)return {playerIds:[],roleIds:[]};
 return input._meta||(input._meta={playerIds:[],roleIds:[]});
}
function insertLogPlayer(){
 const select=$("logInsertPlayer");
 const input=$("logTextInput");
 if(!select||!input||!select.value)return;
 const id=+select.value;
 const person=people.find(p=>p.id===id);
 if(person){
   insertAtCursor(input,person.name);
   const meta=currentCustomMeta();
   if(!meta.playerIds.includes(id))meta.playerIds.push(id);
 }
 select.value="";
}
function insertLogRole(){
 const select=$("logInsertRole");
 const input=$("logTextInput");
 if(!select||!input||!select.value)return;
 const id=+select.value;
 const role=roles.find(r=>r.id===id);
 if(role){
   insertAtCursor(input,role.name);
   const meta=currentCustomMeta();
   if(!meta.roleIds.includes(id))meta.roleIds.push(id);
 }
 select.value="";
}
function addCustomLogEvent(){
 const input=$("logTextInput");
 if(!input)return;
 const text=input.value.trim();
 if(!text)return;
 const meta=currentCustomMeta();
 addCustomLog(text,[...meta.playerIds],[...meta.roleIds]);
 input.value="";
 input._meta={playerIds:[],roleIds:[]};
}
(function(){let s=localStorage.getItem(KEY);if(s){try{let d=JSON.parse(s);people=d.people||[];roles=d.roles||[];logs=d.logs||[];pid=d.pid||1;rid=d.rid||1;dayNumber=Number.isFinite(d.dayNumber)?d.dayNumber:logs.filter(l=>l.type==="day").length;blueClaimCount=Number.isFinite(d.blueClaimCount)?d.blueClaimCount:0}catch{}}normalizePeople();})();
async function exportJson(){
 const data=JSON.stringify({people,roles,logs,pid,rid,dayNumber,blueClaimCount},null,2);
 const blob=new Blob([data],{type:"application/json"});
 if(window.showSaveFilePicker){
   try{
     const handle=await window.showSaveFilePicker({
      suggestedName:"tower_state.json",
       types:[{description:"JSON",accept:{"application/json":[".json"]}}]
     });
     const writable=await handle.createWritable();
     await writable.write(blob);
     await writable.close();
     return;
   }catch(e){
     if(e && e.name==="AbortError") return;
   }
 }
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="tower_state.json";
 a.click();
 URL.revokeObjectURL(a.href);
}
function openImport(){imp.value="";imp.click();}
imp.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);people=d.people||[];roles=d.roles||[];logs=d.logs||[];pid=d.pid||1;rid=d.rid||1;dayNumber=Number.isFinite(d.dayNumber)?d.dayNumber:logs.filter(l=>l.type==="day").length;blueClaimCount=Number.isFinite(d.blueClaimCount)?d.blueClaimCount:0;selectedLogIndex=null;conversationSourceId=null;conversationTargetIds=[];normalizePeople();save();imp.value="";render();};r.readAsText(f);};
function resetState(){if(!confirm("Полностью удалить все данные?"))return;people=[];roles=[];logs=[];pid=1;rid=1;dayNumber=0;blueClaimCount=0;nominationSourceId=null;votingTargetId=null;votingLogId=null;conversationSourceId=null;conversationTargetIds=[];selectedLogIndex=null;save();render();}
function nextPersonPosition(){
 const gap=12,cardW=132,cardH=72;
 const width=field?.clientWidth||800;
 const cols=Math.max(1,Math.floor((width-gap)/(cardW+gap)));
 const i=people.length;
 return {x:gap+(i%cols)*(cardW+gap),y:gap+Math.floor(i/cols)*(cardH+gap)};
}
function addPerson(){let n=pname.value.trim();if(!n)return;let pos=nextPersonPosition();people.push({id:pid++,name:n,roles:[],confirmedRoles:[],dead:false,color:"blue",x:pos.x,y:pos.y});pname.value="";save();render();}
function addRole(){let n=rname.value.trim();if(!n)return;roles.push({id:rid++,name:n});rname.value="";save();render();}
function deleteRole(role){
 if(!confirm(`Удалить роль "${role.name}"?`))return;
 roles=roles.filter(r=>r.id!==role.id);
 people.forEach(p=>{
   p.roles=(p.roles||[]).filter(id=>id!==role.id);
   p.confirmedRoles=(p.confirmedRoles||[]).filter(id=>id!==role.id);
 });
 save();
 render();
}
function closeRoleMenus(except){
 document.querySelectorAll(".role-menu").forEach(m=>{if(m!==except)m.style.display="none";});
}
function deletePerson(person){
 if(!confirm(`Удалить игрока "${person.name}"?`))return;
 people=people.filter(p=>p.id!==person.id);
 if(nominationSourceId===person.id)nominationSourceId=null;
 if(votingTargetId===person.id){votingTargetId=null;votingLogId=null;}
 if(conversationSourceId===person.id)conversationSourceId=null;
 conversationTargetIds=conversationTargetIds.filter(id=>id!==person.id);
 save();
 render();
}
function playerTitle(person){return `${person.dead?"☠ ":""}${esc(person.name)}`;}
function toggleDead(person){
 person.dead=!person.dead;
 addDeathLog(person);
 save();
 render();
}
function closeAllMenus(except){
 document.querySelectorAll(".menu").forEach(m=>{if(m!==except)m.style.display="none";});
}
function openCardMenu(card,menu){
 closeAllMenus(menu);
 menu._card=card;
 const person=people.find(p=>p.id===+card.dataset.id);
 if(person)fillCardMenu(person,menu);
 menu.style.display="block";
 menu.style.left="0px";
 menu.style.top=(card.offsetHeight+4)+"px";
 fitCardMenu(card,menu);
}
function fitCardMenu(card,menu){
 if(!card||!menu||menu.style.display==="none")return;
 menu.style.maxHeight=Math.max(120,field.clientHeight-8)+"px";
 menu.style.width=Math.min(420,field.clientWidth-8)+"px";
 menu.style.maxWidth=(field.clientWidth-8)+"px";
 menu.style.overflowY="auto";
 requestAnimationFrame(()=>{
   const fieldBox=field.getBoundingClientRect();
   const cardBox=card.getBoundingClientRect();
   const menuWidth=menu.offsetWidth;
   const minLeft=fieldBox.left-cardBox.left+4;
   const maxLeft=fieldBox.right-cardBox.left-menuWidth-4;
   let left=Math.min(Math.max(0,minLeft),maxLeft);
   let top=card.offsetHeight+4;
   const belowTop=cardBox.top+top;
   const belowBottom=belowTop+menu.offsetHeight;
   if(belowBottom>fieldBox.bottom)top=-(menu.offsetHeight+4);
   if(cardBox.top+top<fieldBox.top)top=fieldBox.top-cardBox.top+4;
   menu.style.left=left+"px";
   menu.style.top=top+"px";
 });
}
function setConfirmedRole(person,roleId){
 people.forEach(p=>{p.confirmedRoles=(p.confirmedRoles||[]).filter(id=>id!==roleId);});
 if(!person.roles.includes(roleId))person.roles.push(roleId);
 person.confirmedRoles=person.confirmedRoles||[];
 person.confirmedRoles.push(roleId);
 save();
 render();
}
function removeConfirmedRole(person,roleId){
 person.confirmedRoles=(person.confirmedRoles||[]).filter(id=>id!==roleId);
 save();
 render();
}
function playerName(id){return people.find(p=>p.id===id)?.name||"?";}
function currentVotingLog(){
 if(votingLogId){
   const byId=logs.find(l=>l.id===votingLogId);
   if(byId)return byId;
 }
 return votingTargetId?[...logs].reverse().find(l=>l.type==="nomination"&&l.targetId===votingTargetId):null;
}
function currentVotes(){
 return currentVotingLog()?.votes||[];
}
function updateEventHint(){
 if(!window.eventHint)return;
 if(conversationSourceId){
   eventHint.style.display="block";
   const targets=conversationTargetIds.map(playerName).join(", ")||"никого";
   eventHint.innerHTML=`${esc(playerName(conversationSourceId))} общается: выбрано ${esc(targets)} <button onclick="finishConversation()">Завершить</button> <button onclick="cancelConversation()">Отмена</button>`;
   return;
 }
 if(votingTargetId){
   eventHint.style.display="block";
   eventHint.innerHTML=`Голосование за ${esc(playerName(votingTargetId))}: нажмите на карточку голосующего <button onclick="cancelVoting()">Завершить</button>`;
   return;
 }
 if(!nominationSourceId){eventHint.style.display="none";eventHint.innerHTML="";return;}
 eventHint.style.display="block";
 eventHint.innerHTML=`${esc(playerName(nominationSourceId))} номинирует: нажмите на карточку цели на поле <button onclick="cancelNomination()">Отмена</button>`;
}
function startNomination(person){
 nominationSourceId=person.id;
 votingTargetId=null;
 votingLogId=null;
 conversationSourceId=null;
 conversationTargetIds=[];
 closeAllMenus();
 render();
}
function cancelNomination(){
 nominationSourceId=null;
 render();
}
function finishNomination(target){
 if(!nominationSourceId)return;
 const log=addNominationLog(nominationSourceId,target.id);
 votingTargetId=target.id;
 votingLogId=log.id;
 nominationSourceId=null;
 render();
}
function cancelVoting(){
 votingTargetId=null;
 votingLogId=null;
 render();
}
function voteForNominee(voter){
 if(!votingTargetId)return;
 const log=currentVotingLog();
 if(log){
   log.votes=log.votes||[];
   if(log.votes.includes(voter.id))log.votes=log.votes.filter(id=>id!==voter.id);
   else log.votes.push(voter.id);
   save();
   renderLog();
 }else{
   addLog(`${voter.name} голосует за ${playerName(votingTargetId)}`);
 }
 render();
}

function startConversation(person){
 conversationSourceId=person.id;
 conversationTargetIds=[];
 nominationSourceId=null;
 votingTargetId=null;
 votingLogId=null;
 closeAllMenus();
 render();
}
function toggleConversationTarget(person){
 if(!conversationSourceId || person.id===conversationSourceId)return;
 conversationTargetIds=conversationTargetIds.includes(person.id)
   ?conversationTargetIds.filter(id=>id!==person.id)
   :[...conversationTargetIds,person.id];
 render();
}
function finishConversation(){
 if(conversationSourceId&&conversationTargetIds.length)addConversationLog(conversationSourceId,conversationTargetIds);
 conversationSourceId=null;
 conversationTargetIds=[];
 render();
}
function cancelConversation(){
 conversationSourceId=null;
 conversationTargetIds=[];
 render();
}

function render(){
plist.innerHTML="";field.innerHTML="";renderLog();updateEventHint();
field.classList.toggle("log-selected",selectedLogIndex!=null);
const selectedRings=selectedLogRings();
people.forEach(p=>{
 const votes=currentVotes();
 let box=document.createElement("div");box.className="person";
 box.dataset.id=p.id;
 box.innerHTML=`<b>${playerTitle(p)}</b>`;
 plist.append(box);

 let card=document.createElement("div");
 card.className="card";
 card.dataset.id=p.id;
 card.classList.add("color-"+(p.color||"blue"));
 if(p.dead)card.classList.add("dead");
 if(p.id===conversationSourceId)card.classList.add("conversation-source");
 else if(conversationSourceId)card.classList.add("conversation-target");
 if(conversationTargetIds.includes(p.id))card.classList.add("conversation-selected");
 if(p.id===nominationSourceId)card.classList.add("nomination-source");
 else if(nominationSourceId)card.classList.add("nomination-target");
 if(p.id===votingTargetId)card.classList.add("vote-target");
 else if(votingTargetId)card.classList.add("vote-voter");
 if(votes.includes(p.id))card.classList.add("vote-done");
 if(selectedRings.has(p.id)){
   card.classList.add("log-highlighted");
   card.style.setProperty("--log-rings",ringShadow(selectedRings.get(p.id)));
 }
 p.x=Math.min(Math.max(0,p.x||0),Math.max(0,field.clientWidth-120));
 p.y=Math.min(Math.max(0,p.y||0),Math.max(0,field.clientHeight-60));
 card.style.left=p.x+"px";card.style.top=p.y+"px";
 card.innerHTML=cardHtml(p,votes);

 let menu=document.createElement("div");
 menu.className="menu";
 fillCardMenu(p,menu);
 card.append(menu);

 setupCardInteractions(card,menu,p);

 field.append(card);
});
}

function fillCardMenu(person,menu){
 menu.innerHTML="";
 let filterBtn=document.createElement("button");
 filterBtn.textContent="Фильтровать";
 filterBtn.onclick=()=>filterLogByPlayer(person);
 let nominateBtn=document.createElement("button");
 nominateBtn.textContent="Номинировать";
 nominateBtn.onclick=()=>startNomination(person);
 let deadBtn=document.createElement("button");
 deadBtn.textContent=person.dead?"Сделать живым":"Сделать мертвым";
 deadBtn.onclick=()=>toggleDead(person);
 let colorBtn=document.createElement("button");
 colorBtn.textContent="Цвет плашки";
 colorBtn.onclick=()=>openColorEditor(person,menu);
 let deleteBtn=document.createElement("button");
 deleteBtn.textContent="Удалить игрока";
 deleteBtn.onclick=()=>deletePerson(person);
 menu.append(nominateBtn,deadBtn,colorBtn,filterBtn,deleteBtn);
}

function setPlayerColor(person,color){
 person.color=color;
 save();
 render();
}

function openColorEditor(person,menu){
 menu.innerHTML="";
 [["blue","Базовый"],["red","Красный"],["green","Зеленый"],["yellow","Желтый"]].forEach(([color,title])=>{
   let b=document.createElement("button");
   b.textContent=(person.color===color?"✓ ":"")+title;
   b.onclick=()=>setPlayerColor(person,color);
   menu.append(b);
 });
 let back=document.createElement("button");
 back.textContent="Назад";
 back.onclick=()=>fillCardMenu(person,menu);
 menu.append(back);
 fitCardMenu(menu._card,menu);

function openRoleEditor(person,menu){
 menu.innerHTML="";
 roles.forEach(r=>{
   let l=document.createElement("label");
   l.className="role-check";
   let c=document.createElement("input");
   c.type="checkbox";
   c.checked=person.roles.includes(r.id);
   c.value=r.id;
   c.onchange=()=>{
     person.roles=[...menu.querySelectorAll("input:checked")].map(x=>+x.value);
     person.confirmedRoles=(person.confirmedRoles||[]).filter(id=>person.roles.includes(id));
     save();
     refreshRoleViews();
   };
   l.append(c," ",r.name);
   menu.append(l);
 });
 fitCardMenu(menu._card,menu);

function openConfirmedRoleEditor(person,menu,mode){
 menu.innerHTML="";
 const list=mode==="add"?roles:roles.filter(r=>(person.confirmedRoles||[]).includes(r.id));
 if(!list.length){
   let empty=document.createElement("div");
   empty.textContent=mode==="add"?"Нет ролей":"Нет подтвержденных ролей";
   menu.append(empty);
 }
 list.forEach(r=>{
   let b=document.createElement("button");
   b.textContent=r.name;
   b.onclick=()=>mode==="add"?setConfirmedRole(person,r.id):removeConfirmedRole(person,r.id);
   menu.append(b);
 });
 let back=document.createElement("button");
 back.textContent="Назад";
 back.onclick=()=>render();
 menu.append(back);
 fitCardMenu(menu._card,menu);

function setupCardInteractions(card,menu,p){
 const MOVE_LIMIT=8;
 const LONG_PRESS_MS=500;
 let timer=null,dragging=false,moved=false,startX=0,startY=0,ox=0,oy=0;

 const stopTimer=()=>{if(timer){clearTimeout(timer);timer=null;}};
 const setPosition=(x,y)=>{
   const maxX=Math.max(0,field.clientWidth-card.offsetWidth);
   const maxY=Math.max(0,field.clientHeight-card.offsetHeight);
   p.x=Math.min(Math.max(0,x),maxX);
   p.y=Math.min(Math.max(0,y),maxY);
   card.style.left=p.x+"px";
   card.style.top=p.y+"px";
 };

 card.addEventListener("contextmenu",e=>{
   e.preventDefault();
   openCardMenu(card,menu);
 });

 card.addEventListener("pointerdown",e=>{
   if(e.button!==0 || e.target.closest(".menu"))return;
   if(menu.style.display==="block")return;
   if(selectedLogIndex!=null)return;
   if(conversationSourceId){
     e.preventDefault();
     toggleConversationTarget(p);
     return;
   }
   if(nominationSourceId){
     e.preventDefault();
     finishNomination(p);
     return;
   }
   if(votingTargetId){
     e.preventDefault();
     voteForNominee(p);
     return;
   }
   e.preventDefault();
   closeAllMenus();
   startX=e.clientX;
   startY=e.clientY;
   ox=p.x;
   oy=p.y;
   dragging=false;
   moved=false;
   card.setPointerCapture(e.pointerId);

   timer=setTimeout(()=>{
     if(!moved){
       openCardMenu(card,menu);
       dragging=false;
       moved=true;
       if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);
     }
   },LONG_PRESS_MS);
 });

 card.addEventListener("pointermove",e=>{
   if(!card.hasPointerCapture(e.pointerId))return;
   if(menu.style.display==="block")return;
   const dx=e.clientX-startX;
   const dy=e.clientY-startY;
   const dist=Math.hypot(dx,dy);
   if(!dragging && dist>MOVE_LIMIT){
     dragging=true;
     moved=true;
     stopTimer();
     menu.style.display="none";
   }
   if(dragging)setPosition(ox+dx,oy+dy);
 });

 const finish=e=>{
   if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);
   stopTimer();
   if(dragging)save();
   dragging=false;
 };
 card.addEventListener("pointerup",finish);
 card.addEventListener("pointercancel",finish);
}

document.addEventListener("pointerdown",e=>{
 if(!e.target.closest(".fixed-claim")){
   const menu=$("blueClaimMenu");
   if(menu)menu.hidden=true;
 }
 if(!e.target.closest(".menu"))closeAllMenus();
 if(!e.target.closest(".role-row"))closeRoleMenus();
});
render();
