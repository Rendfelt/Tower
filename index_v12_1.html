#field::before{content:"";position:absolute;inset:0;background:url("https://bloodontheclocktower.com/cdn/shop/files/2BloodLogo_2_1.png?v=1758698292&width=2400") center 54%/78% auto no-repeat;opacity:.08;filter:saturate(.95) brightness(.9);mix-blend-mode:screen;pointer-events:none}

.card.nomination-source{background:linear-gradient(180deg,#f4dda2,#c69a36);border-color:#7f5515}
.card.nomination-target{cursor:pointer;box-shadow:0 0 0 2px rgba(11,107,47,.35)}

.card.vote-voter{cursor:pointer;box-shadow:0 0 0 2px rgba(169,68,68,.35)}

.log-selected .card.log-highlighted{opacity:1;filter:none;box-shadow:var(--log-rings),0 0 26px rgba(255,208,51,.42),0 8px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.35)}

.event-hint{width:1000px;box-sizing:border-box;margin:8px 20px 10px;padding:10px 12px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(180deg,#f4d36f,#8f5b16);color:#1c0f05;display:none;box-shadow:0 5px 14px rgba(0,0,0,.32)}
.field-nominate-btn,.field-filter-btn{position:absolute;top:12px;z-index:60;min-height:44px;padding:8px 12px;font-size:20px;box-shadow:0 6px 14px rgba(0,0,0,.42)}
.field-nominate-btn{left:12px}
.field-filter-btn{left:190px}
.stats-panel{display:none;width:1000px;box-sizing:border-box;margin:14px 20px 0;padding:10px 12px;border:1px solid rgba(216,200,239,.55);border-radius:8px;background:linear-gradient(180deg,rgba(72,29,109,.95),rgba(22,10,37,.98));color:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12)}
.stats-panel b{font-family:"Gabriela",Georgia,serif;color:#fff}
.stats-panel button{margin-left:10px;min-height:36px;padding:6px 10px;font-size:18px}
.card b{display:block;border-bottom:1px solid rgba(0,0,0,.2);margin-bottom:5px;padding-bottom:3px;font-family:"Gabriela",Georgia,serif;font-size:22px;font-weight:bold;color:#130c15;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.card-icons{position:absolute;right:6px;top:4px;display:flex;flex-direction:row-reverse;align-items:center;gap:5px;line-height:1;pointer-events:none}
.card-icon{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;font-size:24px;text-shadow:0 1px 2px rgba(255,255,255,.45),0 2px 5px rgba(0,0,0,.35)}
.card-icon.icon-heart{color:#d82032}
.card-icon.icon-smile{color:#f2bd22}
.card-icon.icon-eye{font-size:22px;min-width:30px}
.card-icon.icon-cross{color:#a01824;font-weight:bold;text-shadow:0 1px 0 rgba(255,255,255,.45),0 2px 5px rgba(0,0,0,.35)}
.role-confirmed{font-weight:bold;color:#1f7d36}
.role-crossed{text-decoration:line-through;color:#7c7161}
.panel .role-confirmed,.menu .role-confirmed{color:#78d084}
.panel .role-crossed,.menu .role-crossed{color:#8e8068}
.role-owners{font-size:18px;color:var(--muted);margin:2px 0 8px 16px}
.menu{display:none;position:absolute;background:linear-gradient(180deg,#2c1645,#13091f);border:1px solid rgba(216,200,239,.55);border-radius:8px;padding:7px;z-index:1000;box-shadow:0 12px 30px rgba(0,0,0,.55);width:420px;max-width:calc(1000px - 8px);overflow-x:hidden;color:var(--ink)}
.menu button{display:block;width:100%;min-height:46px;margin:3px 0;font-family:"Alegreya SC",Georgia,serif;font-size:21px;font-weight:normal;text-transform:none;text-shadow:none;padding:10px 12px;text-align:left;background:transparent;border-color:transparent;color:#fff8ee}
.menu button:active{background:rgba(255,255,255,.08)}
.menu label{display:block;margin:8px 0;}
.role-check{display:flex!important;align-items:flex-start;gap:10px;min-height:44px;font-size:21px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.role-check input{flex:0 0 auto;width:24px;height:24px}
.icon-check{display:flex!important;align-items:center;gap:10px;min-height:44px;font-size:21px}
.icon-check input{flex:0 0 auto;width:24px;height:24px}
.role-row,.person-row{display:flex;align-items:flex-start;gap:8px;margin:6px 0;position:relative}
.role-row button,.person-row button{min-height:40px;font-size:20px;padding:7px 12px}
.role-menu,.person-menu{display:none;position:absolute;left:0;top:44px;background:linear-gradient(180deg,#2c1645,#13091f);border:1px solid rgba(216,200,239,.55);border-radius:8px;padding:7px;z-index:20;box-shadow:0 8px 18px rgba(0,0,0,.5);min-width:190px}
.role-menu button,.person-menu button{display:block;width:100%;min-height:44px;font-family:"Alegreya SC",Georgia,serif;font-size:20px;font-weight:normal;text-transform:none;text-shadow:none;padding:10px 12px;margin:3px 0;text-align:left;background:transparent;border-color:transparent;color:#fff8ee}
input,button,select{font-family:"Alegreya SC",Georgia,serif;font-size:20px;border:1px solid var(--line);border-radius:8px;background:#170b25;color:var(--ink);padding:9px 10px}
input::placeholder{color:#bba5db}
select option{background:#170b25;color:var(--ink)}
button{cursor:pointer;font-family:"Alegreya SC",Georgia,serif;background:linear-gradient(180deg,var(--purple3),var(--purple2) 48%,var(--purple));color:#fff;text-transform:uppercase;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,.65)}
button:active{transform:translateY(1px)}
button,select,summary,label{outline:none;-webkit-touch-callout:none}
button:focus,button:focus-visible,select:focus,select:focus-visible,summary:focus,summary:focus-visible{outline:none}
input:focus{outline:2px solid rgba(234,208,146,.42);outline-offset:1px}
ul{margin:0;padding-left:22px}
body *{user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text}
input:focus{outline:2px solid rgba(194,144,255,.45);outline-offset:1px}
</style><body>

<div class=top-area><img class=corner-logo src="https://bloodontheclocktower.com/cdn/shop/files/logo_3.png" alt="">
<p><input id=pname placeholder="Имя"><button onclick="addPerson()">Добавить игрока</button></p>
<p><input id=rname placeholder="Роль"><button onclick="addRole()">Добавить роль</button></p>
<p><button onclick="exportJson()">Экспорт</button>
<button onclick="openImport()">Импорт</button>
<button onclick="resetState()">Сброс</button>
<input id="imp" type=file accept=".json" hidden></p></div>

<div class=wrap><details class=panel><summary>Игроки</summary><div id=plist></div></details><details class=panel><summary>Роли</summary><ul id=rlist></ul></details></div>
<div id=eventHint class=event-hint></div><div class=field-wrap><div id=field></div></div><div id=playerStatsPanel class=stats-panel></div><details class="panel log-panel" open><summary>Лог</summary><div class=logcomposer><input id=logTextInput placeholder="Событие" onkeydown="if(event.key==='Enter')addCustomLogEvent()"><select id=logInsertPlayer onchange="insertLogPlayer()"></select><select id=logInsertRole onchange="insertLogRole()"></select><button onclick="addCustomLogEvent()">Добавить</button></div><div class=fixed-events><button id=dayEventBtn onclick="addDayLog()"></button></div><div class=logfilters><select id=logPlayerFilter onchange="renderLog()"></select><select id=logRoleFilter onchange="renderLog()"></select></div><div id=loglist class=logbox></div></details>

<script>
const KEY="mafia-demo-state";
let people=[],roles=[],logs=[],pid=1,rid=1,dayNumber=0,nominationPickSource=false,filterPickPlayer=false,nominationSourceId=null,votingTargetId=null,votingLogId=null,conversationSourceId=null,conversationTargetIds=[],selectedLogIndex=null;
const $=id=>document.getElementById(id);
const rn=id=>roles.find(r=>r.id===id)?.name||"?";
const rc=id=>people.filter(p=>p.roles.includes(id) && !roleIsCrossed(p,id)).length;
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
function normalizePeople(){people.forEach(p=>{p.roles=p.roles||[];p.dead=!!p.dead;p.color=["blue","red","green","yellow"].includes(p.color)?p.color:"blue";p.icons=Array.isArray(p.icons)?p.icons:(p.icon?[p.icon]:[]);p.icons=p.icons.filter(icon=>["heart","eye","cross","smile"].includes(icon));delete p.icon;p.deathReason=p.dead?p.deathReason||"":"";p.confirmedRoles=(p.confirmedRoles||[]).filter(id=>p.roles.includes(id));});}
function roleConfirmedByOther(person,id){return people.some(p=>p.id!==person.id && (p.confirmedRoles||[]).includes(id));}
function roleIsConfirmed(id){return people.some(p=>(p.confirmedRoles||[]).includes(id));}
function roleIsCrossed(person,id){
 const confirmed=person.confirmedRoles||[];
 return roleConfirmedByOther(person,id) || (confirmed.length>0 && !confirmed.includes(id));
}
function activeRoleOwners(id){return people.filter(p=>p.roles.includes(id) && !roleIsCrossed(p,id));}
function roleListHtml(role){
 const owners=activeRoleOwners(role.id).map(p=>esc(p.name)).join(", ");
 const mark=roleIsConfirmed(role.id)?"<span class=\"role-confirmed\">✓</span> ":"";
 return `${mark}${esc(role.name)} (${rc(role.id)})${owners?`<div class="role-owners">${owners}</div>`:""}`;
}
function roleHtml(person,id){
 const name=esc(rn(id));
 if((person.confirmedRoles||[]).includes(id))return `<span class="role-confirmed">✓ ${name}</span>`;
 if(roleIsCrossed(person,id))return `<span class="role-crossed">${name}</span>`;
 return name;
}
function personRolesHtml(person){return person.roles.map(id=>roleHtml(person,id)).join("<br>")||"<i>нет ролей</i>";}
function cardRolesHtml(person){return person.roles.map(id=>roleHtml(person,id)).join("<br>");}
function cardIconHtml(person){
 const icons={heart:"❤",eye:"👁️",cross:"✕",smile:"🙂"};
 const html=(person.icons||[]).map(icon=>icons[icon]?`<span class="card-icon icon-${icon}">${icons[icon]}</span>`:"").join("");
 return html?`<span class="card-icons">${html}</span>`:"";
}
function cardHtml(person,votes){
 return cardIconHtml(person)+"<b>"+playerTitle(person)+(votes.includes(person.id)?" ✋":"")+"</b>"
   +(person.id===votingTargetId?`<div class="vote-count">Голосов: ${votes.length}</div>`:"")
   +cardRolesHtml(person);
}
function refreshRoleViews(){
 const votes=currentVotes();
 document.querySelectorAll(".person").forEach(box=>{
   const person=people.find(p=>p.id===+box.dataset.id);
   if(person)box.innerHTML=`<b>${playerTitle(person)}</b><div>${personRolesHtml(person)}</div>`;
 });
 document.querySelectorAll(".card").forEach(card=>{
   const person=people.find(p=>p.id===+card.dataset.id);
   if(person){
     const menu=card.querySelector(".menu");
     card.innerHTML=cardHtml(person,votes);
     if(menu)card.append(menu);
   }
 });
 roles.forEach(r=>{
   const info=document.querySelector(`[data-role-info="${r.id}"]`);
   if(info)info.innerHTML=roleListHtml(r);
 });
 renderLog();
}
function save(){localStorage.setItem(KEY,JSON.stringify({people,roles,logs,pid,rid,dayNumber}));}
function logTime(){return new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
function addLog(text){
 logs.push({time:logTime(),text});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function addCustomLog(text,playerIds,roleIds){
 logs.push({type:"custom",time:logTime(),text,playerIds,roleIds});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function deathReasonText(log){
 const reason=typeof log==="string"?log:log.reason;
 if(reason==="ability"){
   const roleName=typeof log==="object"?(log.abilityRoleName||rn(log.abilityRoleId)):"";
   return `умирает от способности${roleName&&roleName!=="?"?` ${roleName}`:""}`;
 }
 return ({executed:"казнен",night:"умирает ночью",unclear:"умирает неясно"})[reason]||"умирает";
}
function addDeathLog(person,reason,abilityRole){
 logs.push({type:"death",time:logTime(),playerId:person.id,dead:person.dead,reason:person.dead?reason||person.deathReason||"":"",abilityRoleId:abilityRole?.id||null,abilityRoleName:abilityRole?.name||""});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function addDayLog(){
 dayNumber++;
 logs.push({type:"day",time:logTime(),day:dayNumber});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function addNominationLog(sourceId,targetId){
 const log={id:Date.now()+"-"+Math.random().toString(16).slice(2),type:"nomination",time:logTime(),sourceId,targetId,votes:[]};
 logs.push(log);
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
 return log;
}
function addConversationLog(sourceId,targetIds){
 logs.push({type:"conversation",time:logTime(),sourceId,targetIds:[...targetIds]});
 if(logs.length>500)logs=logs.slice(-500);
 save();
 renderLog();
}
function logText(log){
 if(log.type==="custom")return log.text||"";
 if(log.type==="death")return `${playerName(log.playerId)} ${log.dead?deathReasonText(log):"оживает"}`;
 if(log.type==="day")return `Новый день ${log.day||""}`.trim();
 if(log.type==="conversation")return `${playerName(log.sourceId)} общается с ${(log.targetIds||[]).map(playerName).join(", ")}`;
 if(log.type==="nomination"){
   const source=playerName(log.sourceId);
   const target=playerName(log.targetId);
   const voteIds=log.votes||[];
   const votes=voteIds.map(playerName).join(", ");
   return `${source} номинирует ${target}.${votes?` За ${target} голосуют (${voteIds.length}): ${votes}`:""}`;
 }
 return log.text||"";
}
function logPlayers(log){
 const mentioned=people.filter(p=>p.name&&logText(log).includes(p.name)).map(p=>p.id);
 if(log.type==="custom")return [...new Set([...(log.playerIds||[]),...mentioned])];
 if(log.type==="death")return [log.playerId].filter(id=>id!=null);
 if(log.type==="conversation")return [log.sourceId,...(log.targetIds||[])].filter(id=>id!=null);
 if(log.type==="nomination")return [log.sourceId,log.targetId,...(log.votes||[])].filter(id=>id!=null);
 return mentioned;
}
function logRoles(log){
 if(log.type==="custom")return log.roleIds||[];
 if(log.type==="death"&&log.abilityRoleId)return [log.abilityRoleId];
 return roles.filter(r=>logText(log).includes(r.name)).map(r=>r.id);
}
function renderComposerOptions(){
 const playerSelect=$("logInsertPlayer");
 const roleSelect=$("logInsertRole");
 if(!playerSelect||!roleSelect)return;

function highlightLogText(text){

 const replaceEntity=(source,name,cls)=>{
   const value=esc(name);
   let out="",pos=0;
   while(pos<source.length){
     const idx=source.indexOf(value,pos);
     if(idx<0){out+=source.slice(pos);break;}
     const before=source[idx-1]||"";
     const after=source[idx+value.length]||"";
     out+=source.slice(pos,idx);
     out+=(!isWordChar(before)&&!isWordChar(after))?`<span class="${cls}">${value}</span>`:value;
     pos=idx+value.length;
   }
   return out;
 };
 const playerMarks=[];
 people.forEach((p,i)=>{
   if(!p.name)return;
   const mark=`@@PLAYER_${i}@@`;
   playerMarks.push([mark,`<span class="log-player">${esc(p.name)}</span>`]);
   html=replaceEntity(html,p.name,`PLAYER_MARK_${i}`);
   html=html.split(`<span class="PLAYER_MARK_${i}">${esc(p.name)}</span>`).join(mark);
 });
 roles.forEach(r=>{
   if(!r.name)return;

}

function setPlayerIcon(person,icon,enabled){

 person.icons=enabled?[...new Set([...icons,icon])]:icons.filter(value=>value!==icon);
 save();
 refreshRoleViews();
}

function openIconEditor(person,menu){
 menu.innerHTML="";
 [["heart","❤ Сердечко"],["eye","👁️ Глаз"],["cross","✕ Красный косой крест"],["smile","🙂 Смайлик"]].forEach(([icon,title])=>{

 });

function openRoleEditor(person,menu){
 menu.innerHTML="";
 roles.forEach(r=>{
   let l=document.createElement("label");
   l.className="role-check";
   let c=document.createElement("input");
   c.type="checkbox";
   c.checked=person.roles.includes(r.id);

   c.onchange=()=>{
     person.roles=[...menu.querySelectorAll("input:checked")].map(x=>+x.value);

   menu.append(l);
 });

}

 const list=mode==="add"?roles:roles.filter(r=>(person.confirmedRoles||[]).includes(r.id));
 if(!list.length){
   let empty=document.createElement("div");
   empty.textContent=mode==="add"?"Нет ролей":"Нет подтвержденных ролей";
   menu.append(empty);

 list.forEach(r=>{

}
function setupCardInteractions(card,menu,p){
 const MOVE_LIMIT=8;
 const LONG_PRESS_MS=500;
 let timer=null,dragging=false,moved=false,startX=0,startY=0,ox=0,oy=0;

 const stopTimer=()=>{if(timer){clearTimeout(timer);timer=null;}};
 const setPosition=(x,y)=>{
   const maxX=Math.max(0,field.clientWidth-card.offsetWidth);
   const maxY=Math.max(0,field.clientHeight-card.offsetHeight);
   p.x=Math.min(Math.max(0,x),maxX);
   p.y=Math.min(Math.max(0,y),maxY);
   card.style.left=p.x+"px";
   card.style.top=p.y+"px";
 };

 card.addEventListener("contextmenu",e=>{
   e.preventDefault();
   openCardMenu(card,menu);
 });

 card.addEventListener("pointerdown",e=>{
   if(e.button!==0 || e.target.closest(".menu"))return;
   if(menu.style.display==="block")return;
   if(selectedLogIndex!=null)return;
   if(conversationSourceId){
     e.preventDefault();
     toggleConversationTarget(p);
     return;
   }
   if(nominationPickSource){
     e.preventDefault();
     chooseNominationSource(p);
     return;
   }
   if(filterPickPlayer){
     e.preventDefault();
     filterLogByPlayer(p);
     return;
   }
   if(nominationSourceId){
     e.preventDefault();
     finishNomination(p);
     return;
   }
   if(votingTargetId){
     e.preventDefault();
     voteForNominee(p);
     return;
   }
   e.preventDefault();
   closeAllMenus();
   startX=e.clientX;
   startY=e.clientY;
   ox=p.x;
   oy=p.y;
   dragging=false;
   moved=false;
   card.setPointerCapture(e.pointerId);

   timer=setTimeout(()=>{
     if(!moved){
       openCardMenu(card,menu);
       dragging=false;
       moved=true;
       if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);
     }
   },LONG_PRESS_MS);
 });

 card.addEventListener("pointermove",e=>{
   if(!card.hasPointerCapture(e.pointerId))return;
   if(menu.style.display==="block")return;
   const dx=e.clientX-startX;
   const dy=e.clientY-startY;
   const dist=Math.hypot(dx,dy);
   if(!dragging && dist>MOVE_LIMIT){
     dragging=true;
     moved=true;
     stopTimer();
     menu.style.display="none";
   }
   if(dragging)setPosition(ox+dx,oy+dy);
 });

 const finish=e=>{
   if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);
   stopTimer();
   if(dragging)save();
   dragging=false;
 };
 card.addEventListener("pointerup",finish);
 card.addEventListener("pointercancel",finish);
}

document.addEventListener("pointerdown",e=>{
 if(!e.target.closest(".menu"))closeAllMenus();
 if(!e.target.closest(".role-row"))closeRoleMenus();
 if(!e.target.closest(".person-row"))closePersonMenus();
});
render();
</script></body></html>
