.card b{display:block;border-bottom:1px solid rgba(0,0,0,.2);margin-bottom:5px;padding-bottom:3px;font-family:"Gabriela",Georgia,serif;font-size:22px;font-weight:bold;color:#130c15;text-shadow:0 1px 0 rgba(255,255,255,.35)}

.role-check{display:flex!important;align-items:flex-start;gap:10px;min-height:44px;font-size:21px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}

.role-row,.person-row{display:flex;align-items:flex-start;gap:8px;margin:6px 0;position:relative}
.role-row button,.person-row button{min-height:40px;font-size:20px;padding:7px 12px}
.role-menu,.person-menu{display:none;position:absolute;left:0;top:44px;background:linear-gradient(180deg,#2c1645,#13091f);border:1px solid rgba(216,200,239,.55);border-radius:8px;padding:7px;z-index:20;box-shadow:0 8px 18px rgba(0,0,0,.5);min-width:190px}
.role-menu button,.person-menu button{display:block;width:100%;min-height:44px;font-family:"Alegreya SC",Georgia,serif;font-size:20px;font-weight:normal;text-transform:none;text-shadow:none;padding:10px 12px;margin:3px 0;text-align:left;background:transparent;border-color:transparent;color:#fff8ee}
input,button,select{font-family:"Alegreya SC",Georgia,serif;font-size:20px;border:1px solid var(--line);border-radius:8px;background:#170b25;color:var(--ink);padding:9px 10px}

input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text}

</style><body>

<div class=system-header><details class="panel system-panel"><summary>Система</summary><div class=top-area>
<p><input id=pname placeholder="Имя"><button onclick="addPerson()">Добавить игрока</button></p>
<p><input id=rname placeholder="Роль"><button onclick="addRole()">Добавить роль</button><select id=rtype><option value="горожанин">горожанин</option><option value="изгой">изгой</option><option value="приспешник">приспешник</option><option value="демон">демон</option></select></p>
<div class=lock-toggle-row><label class=switch><input id=fieldLockToggle type=checkbox onchange="setFieldLocked(this.checked)"><span class=switch-track></span><span class=switch-label>Зафиксировать поле</span></label></div>
<p><button onclick="exportJson()">Экспорт</button>
<button onclick="openImport()">Импорт</button>
<button onclick="resetState()">Сброс</button>
<input id="imp" type=file accept=".json" hidden></p></div>

<div class=wrap><details class=panel><summary>Игроки</summary><div id=plist></div></details><details class=panel><summary>Роли</summary><ul id=rlist></ul></details></div></details><img class=corner-logo src="https://bloodontheclocktower.com/cdn/shop/files/logo_3.png" alt=""></div>
<div id=eventHint class=event-hint></div><div id=worldTabs class=world-tabs></div><div class=field-wrap><div id=field></div></div><div id=playerStatsPanel class=stats-panel></div><details class="panel log-panel" open><summary>Лог</summary><div class=logcomposer><input id=logTextInput placeholder="Событие" onkeydown="if(event.key==='Enter')addCustomLogEvent()"><select id=logInsertPlayer onchange="insertLogPlayer()"></select><select id=logInsertRole onchange="insertLogRole()"></select><button onclick="addCustomLogEvent()">Добавить</button></div><div class=fixed-events><button id=dayEventBtn onclick="addDayLog()"></button></div><div class=logfilters><select id=logPlayerFilter onchange="renderLog()"></select><select id=logRoleFilter onchange="renderLog()"></select></div><div id=loglist class=logbox></div></details>

<script>
const KEY="mafia-demo-state";
let people=[],roles=[],logs=[],worlds=[],pid=1,rid=1,dayNumber=0,currentWorldId=1,fieldLocked=false,nominationPickSource=false,filterPickPlayer=false,nominationSourceId=null,votingTargetId=null,votingLogId=null,conversationSourceId=null,conversationTargetIds=[],selectedLogIndex=null;
const activeTouchPointers=new Set();
function cancelAllCardGestures(){
 document.querySelectorAll(".card").forEach(card=>{
   activeTouchPointers.forEach(id=>{if(card.hasPointerCapture(id))card.releasePointerCapture(id);});
 });
}
const $=id=>document.getElementById(id);
const rn=id=>roles.find(r=>r.id===id)?.name||"?";
const rc=id=>people.filter(p=>p.roles.includes(id) && !roleIsCrossed(p,id)).length;
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
const ROLE_TYPES=["горожанин","изгой","приспешник","демон"];
function normalizeRoles(){roles.forEach(r=>{r.type=ROLE_TYPES.includes(r.type)?r.type:"горожанин";});}
function clonePeople(list=people){return JSON.parse(JSON.stringify(list));}
function deathOnlyPersonFromMain(p){
 return {id:p.id,name:p.name,roles:[],confirmedRoles:[],dead:!!p.dead,color:"blue",icons:[],x:p.x||0,y:p.y||0,deathReason:p.dead?p.deathReason||"":""};
}
function currentWorld(){return worlds.find(w=>w.id===currentWorldId)||worlds[0];}
function isMainWorld(){return currentWorldId===1;}
function isDeathOnlyWorld(){return currentWorld()?.kind==="death-only";}
function effectiveFieldLocked(){return fieldLocked||!isMainWorld();}
function normalizeWorlds(){
 worlds=Array.isArray(worlds)?worlds:[];
 if(!worlds.length)worlds=[{id:1,name:"Основной",people:clonePeople(people)}];
 worlds=worlds.map((w,i)=>({id:Number.isFinite(w.id)?w.id:i+1,name:w.name||`Мир ${i+1}`,kind:w.kind||"",people:Array.isArray(w.people)?w.people:clonePeople(people)}));
 let main=worlds.find(w=>w.id===1);
 if(!main){
   main={id:1,name:"Основной",kind:"",people:clonePeople(people)};
   worlds.unshift(main);
 }
 main.name="Основной";
 main.kind="";
 const occupiedSecond=worlds.find(w=>w.id===2&&w.kind!=="death-only");
 if(occupiedSecond)occupiedSecond.id=Math.max(2,...worlds.map(w=>w.id))+1;
 let deathWorld=worlds.find(w=>w.kind==="death-only")||worlds.find(w=>w.id===2);
 if(!deathWorld){
   deathWorld={id:2,name:"Стата",kind:"death-only",people:[]};
   worlds.splice(1,0,deathWorld);
 }
 deathWorld.id=2;
 deathWorld.name="Стата";
 deathWorld.kind="death-only";
 syncDeathOnlyWorld();
 worlds.sort((a,b)=>a.id===1?-1:b.id===1?1:a.id===2?-1:b.id===2?1:a.id-b.id);
 if(!worlds.some(w=>w.id===currentWorldId))currentWorldId=worlds[0].id;
}
function syncActiveWorld(){
 const world=currentWorld();
 if(world&&!isDeathOnlyWorld())world.people=clonePeople(people);
}
function syncDeathOnlyWorld(){
 const main=worlds.find(w=>w.id===1);
 const deathWorld=worlds.find(w=>w.kind==="death-only");
 if(!main||!deathWorld)return;
 deathWorld.people=(main.people||[]).map(deathOnlyPersonFromMain);
}
function loadActiveWorld(){
 syncDeathOnlyWorld();
 const world=currentWorld();
 people=world?clonePeople(world.people):[];
 normalizePeople();
}
function syncDeathToOtherWorlds(sourcePerson){
 if(!isMainWorld())return;
 worlds.forEach(world=>{
   if(world.id===currentWorldId || !Array.isArray(world.people))return;
   const target=world.people.find(p=>p.id===sourcePerson.id);
   if(!target)return;
   target.dead=!!sourcePerson.dead;
   target.deathReason=sourcePerson.deathReason||"";
 });

     if((log.votes||[]).includes(id))stats.voted++;
   }
   if(log.type==="conversation"&&(log.sourceId===id||(log.targetIds||[]).includes(id)))stats.conversations++;
   return stats;
 },{nominated:0,wasNominated:0,conversations:0,voted:0});
}
function renderPlayerStatsPanel(){
 const panel=$("playerStatsPanel");
 const playerId=$("logPlayerFilter")?.value||"";
 const person=people.find(p=>String(p.id)===playerId);
 if(!panel||!person){if(panel){panel.style.display="none";panel.innerHTML="";}return;}
 const stats=playerStats(person);
 panel.style.display="block";
 panel.innerHTML=`<b>${playerTitle(person)}</b><br>Номинировал: ${stats.nominated}<br>Номинирован: ${stats.wasNominated}<br>Разговоры: ${stats.conversations}<br>Голосовал: ${stats.voted} <button onclick="clearPlayerFilter()">Сбросить</button>`;
}
function startPlayerFilterFromField(){
 filterPickPlayer=true;
 nominationPickSource=false;
 nominationSourceId=null;
 votingTargetId=null;
 votingLogId=null;
 conversationSourceId=null;
 conversationTargetIds=[];
 closeAllMenus();
 render();
}
function updateEventHint(){
 if(!window.eventHint)return;
 if(conversationSourceId){
   eventHint.style.display="block";
   eventHint.innerHTML=`${esc(playerName(conversationSourceId))} общается: нажмите на одну карточку собеседника <button onclick="cancelConversation()">Отмена</button>`;
   return;
 }
 if(votingTargetId){
   eventHint.style.display="block";
   eventHint.innerHTML=`Голосование за ${esc(playerName(votingTargetId))}: нажмите на карточку голосующего <button onclick="cancelVoting()">Завершить</button>`;
   return;
 }
 if(nominationPickSource){
   eventHint.style.display="block";
   eventHint.innerHTML=`Номинация: нажмите на карточку игрока, который номинирует <button onclick="cancelNomination()">Отмена</button>`;
   return;
 }
 if(filterPickPlayer){
   eventHint.style.display="block";
   eventHint.innerHTML=`Фильтр: нажмите на карточку игрока <button onclick="cancelPlayerFilterPick()">Отмена</button>`;
   return;
 }
 if(!nominationSourceId){eventHint.style.display="none";eventHint.innerHTML="";return;}
 eventHint.style.display="block";
 eventHint.innerHTML=`${esc(playerName(nominationSourceId))} номинирует: нажмите на карточку цели на поле <button onclick="cancelNomination()">Отмена</button>`;
}
function chooseNominationSource(person){
 if(!isMainWorld())return;
 nominationPickSource=false;
 filterPickPlayer=false;
 nominationSourceId=person.id;
 votingTargetId=null;
 votingLogId=null;
 conversationSourceId=null;
 conversationTargetIds=[];
 render();
}
function cancelNomination(){
 nominationPickSource=false;
 nominationSourceId=null;
 render();
}
function cancelPlayerFilterPick(){
 filterPickPlayer=false;
 render();
}
function finishNomination(target){
 if(!isMainWorld())return;
 if(!nominationSourceId)return;
 const log=addNominationLog(nominationSourceId,target.id);
 if(!log)return;
 votingTargetId=target.id;
 votingLogId=log.id;
 nominationPickSource=false;
 nominationSourceId=null;
 render();
}
function cancelVoting(){
 votingTargetId=null;
 votingLogId=null;
 render();
}
function voteForNominee(voter){
 if(!isMainWorld())return;
 if(!votingTargetId)return;
 const log=currentVotingLog();
 if(log){
   log.votes=log.votes||[];
   if(log.votes.includes(voter.id))log.votes=log.votes.filter(id=>id!==voter.id);
   else log.votes.push(voter.id);
   save();
   renderLog();
 }else{
   addLog(`${voter.name} голосует за ${playerName(votingTargetId)}`);
 }
 render();
}

function startConversation(person){
 if(!isMainWorld())return;
 nominationPickSource=false;
 filterPickPlayer=false;
 conversationSourceId=person.id;
 conversationTargetIds=[];
 nominationSourceId=null;
 votingTargetId=null;
 votingLogId=null;
 closeAllMenus();
 render();
}
function toggleConversationTarget(person){
 if(!isMainWorld())return;
 if(!conversationSourceId || person.id===conversationSourceId)return;
 addConversationLog(conversationSourceId,[person.id]);
 conversationSourceId=null;
 conversationTargetIds=[];
 render();
}
function finishConversation(){
 if(!isMainWorld())return;
 if(conversationSourceId&&conversationTargetIds.length)addConversationLog(conversationSourceId,conversationTargetIds);
 conversationSourceId=null;
 conversationTargetIds=[];
 render();
}
function cancelConversation(){
 conversationSourceId=null;
 conversationTargetIds=[];
 render();
}
function selectWorld(id){
 syncActiveWorld();
 currentWorldId=id;
 loadActiveWorld();
 nominationPickSource=false;
 filterPickPlayer=false;
 nominationSourceId=null;
 votingTargetId=null;
 votingLogId=null;
 conversationSourceId=null;
 conversationTargetIds=[];
 closeAllMenus();
 save();
 render();
}
function addWorld(){
 syncActiveWorld();
 const nextId=Math.max(0,...worlds.map(w=>w.id))+1;
 const sourcePeople=isDeathOnlyWorld()?clonePeople(worlds.find(w=>w.id===1)?.people||[]):clonePeople(people);
 worlds.push({id:nextId,name:`Мир ${worlds.filter(w=>w.id>2).length+1}`,kind:"",people:sourcePeople});
 currentWorldId=nextId;
 loadActiveWorld();
 save();
 render();
}
function setFieldLocked(locked){
 if(!isMainWorld())return;
 fieldLocked=!!locked;
 closeAllMenus();
 save();
 render();
}

plist.innerHTML="";rlist.innerHTML="";field.innerHTML="";renderLog();updateEventHint();
renderWorldTabs();
const fieldLockToggle=$("fieldLockToggle");
if(fieldLockToggle){fieldLockToggle.checked=effectiveFieldLocked();fieldLockToggle.disabled=!isMainWorld();}
field.classList.toggle("log-selected",selectedLogIndex!=null);
const selectedRings=selectedLogRings();
let dayBadge=document.createElement("div");
dayBadge.id="currentDayLabel";
dayBadge.className="day-badge";
dayBadge.textContent=`День ${dayNumber}`;
field.append(dayBadge);
roles.forEach(r=>{
 let li=document.createElement("li");
 let row=document.createElement("div");
 row.className="role-row";
 let info=document.createElement("div");
 info.dataset.roleInfo=r.id;
 info.innerHTML=roleListHtml(r);
 let menuBtn=document.createElement("button");
 menuBtn.textContent="⋮";
 let roleMenu=document.createElement("div");
 roleMenu.className="role-menu";

 del.textContent="Удалить";
 del.onclick=()=>deleteRole(r);
 roleMenu.append(del);
 menuBtn.onclick=e=>{

 };
 row.append(menuBtn,info,roleMenu);
 li.append(row);
 rlist.append(li);
});
people.forEach(p=>{
 const votes=currentVotes();
 let box=document.createElement("div");box.className="person";
 if(p.dead)box.classList.add("dead");
 box.dataset.id=p.id;
 box.innerHTML=`<b>${playerTitle(p)}</b><div>${playerDetailsHtml(p)}</div>`;
 let personRow=document.createElement("div");
 personRow.className="person-row";
 let menuBtn=document.createElement("button");
 menuBtn.textContent="⋮";
 let personMenu=document.createElement("div");
 personMenu.className="person-menu";
 let del=document.createElement("button");
 del.textContent="Удалить";
 del.onclick=()=>deletePerson(p);
 personMenu.append(del);
 menuBtn.onclick=e=>{
   e.stopPropagation();
   const next=personMenu.style.display==="block"?"none":"block";
   closePersonMenus(personMenu);
   closeRoleMenus();
   personMenu.style.display=next;
 };
 personRow.append(menuBtn,box,personMenu);
 plist.append(personRow);

 let card=document.createElement("div");
 card.className="card";
 card.dataset.id=p.id;
 card.classList.add("color-"+(p.color||"blue"));
 if(p.dead)card.classList.add("dead");
 if(p.id===conversationSourceId)card.classList.add("conversation-source");
 else if(conversationSourceId)card.classList.add("conversation-target");
 if(conversationTargetIds.includes(p.id))card.classList.add("conversation-selected");
 if(p.id===nominationSourceId)card.classList.add("nomination-source");
 else if(nominationSourceId)card.classList.add("nomination-target");
 if(nominationPickSource)card.classList.add("nomination-target");
 if(filterPickPlayer)card.classList.add("nomination-target");
 if(p.id===votingTargetId)card.classList.add("vote-target");
 else if(votingTargetId)card.classList.add("vote-voter");
 if(votes.includes(p.id))card.classList.add("vote-done");
 if(selectedRings.has(p.id)){
   card.classList.add("log-highlighted");
   card.style.setProperty("--log-rings",ringShadow(selectedRings.get(p.id)));
 }
 p.x=Math.min(Math.max(0,p.x||0),Math.max(0,field.clientWidth-120));
 p.y=Math.min(Math.max(0,p.y||0),Math.max(0,field.clientHeight-60));
 card.style.left=p.x+"px";card.style.top=p.y+"px";
 card.innerHTML=cardHtml(p,votes);

 let menu=document.createElement("div");
 menu.className="menu";
 fillCardMenu(p,menu);
 card.append(menu);

 setupCardInteractions(card,menu,p);

 field.append(card);
});

 back.onclick=()=>fillCardMenu(person,menu);

 person.icons=enabled?[...new Set([...icons,icon])]:icons.filter(value=>value!==icon);

function openRoleEditor(person,menu){
 menu.innerHTML="";
 menu.classList.add("role-choice-menu");
 let grid=document.createElement("div");
 grid.className="role-choice-grid";
 menu.append(grid);
 forEachRoleByType((r)=>{
   if(!r){
     let sep=document.createElement("div");
     sep.className="role-type-separator";
     grid.append(sep);
     return;
   }
   let l=document.createElement("label");
   l.className="role-check";
   let c=document.createElement("input");

   c.value=r.id;
   c.onchange=()=>{
     person.roles=[...menu.querySelectorAll("input:checked")].map(x=>+x.value);
     person.confirmedRoles=(person.confirmedRoles||[]).filter(id=>person.roles.includes(id));
     save();
     refreshRoleViews();
   };
   l.append(c," ",r.name);
   grid.append(l);
 });

function openConfirmedRoleEditor(person,menu){
 menu.innerHTML="";
 menu.classList.add("role-choice-menu");
 if(!roles.length){
   let empty=document.createElement("div");
   empty.textContent="Нет ролей";
   menu.append(empty);
 }
 let grid=document.createElement("div");
 grid.className="role-choice-grid";
 menu.append(grid);
 forEachRoleByType((r)=>{
   if(!r){
     let sep=document.createElement("div");
     sep.className="role-type-separator";
     grid.append(sep);
     return;
   }
   let b=document.createElement("button");
   const takenByOther=roleConfirmedByOther(person,r.id);
   const selectedByPerson=(person.confirmedRoles||[]).includes(r.id);
   const unconfirmedAssigned=person.roles.includes(r.id)&&!selectedByPerson;
   b.className="role-check";
   b.disabled=takenByOther;
   b.innerHTML=selectedByPerson?`<span class="confirmed-mark">✓</span> ${esc(r.name)}`:unconfirmedAssigned?`✓ ${esc(r.name)}`:takenByOther?`${esc(r.name)} — занята`:esc(r.name);
   b.onclick=()=>{
     if(takenByOther)return;
     setConfirmedRole(person,r.id);
     closeAllMenus();
   };
   grid.append(b);
 });
 fitCardMenu(menu._card,menu);
}
function setupCardInteractions(card,menu,p){
 const MOVE_LIMIT=8;
 const SWIPE_LIMIT=42;
 let dragging=false,moved=false,startX=0,startY=0,ox=0,oy=0;
 const cancelCardGesture=pointerId=>{
   if(card.hasPointerCapture(pointerId))card.releasePointerCapture(pointerId);
   dragging=false;
   moved=false;
 };
 const setPosition=(x,y)=>{
   const maxX=Math.max(0,field.clientWidth-card.offsetWidth);
   const maxY=Math.max(0,field.clientHeight-card.offsetHeight);
   p.x=Math.min(Math.max(0,x),maxX);
   p.y=Math.min(Math.max(0,y),maxY);
   card.style.left=p.x+"px";
   card.style.top=p.y+"px";
 };

 card.addEventListener("contextmenu",e=>{
   e.preventDefault();
   if(!effectiveFieldLocked())return;
   e.stopPropagation();
   openCardMenu(card,menu);
 });

 card.addEventListener("pointerdown",e=>{
   if(e.pointerType==="touch"){
     activeTouchPointers.add(e.pointerId);
     if(activeTouchPointers.size>1){
       cancelAllCardGestures();
       cancelCardGesture(e.pointerId);
       return;
     }
   }
   if(e.button!==0 || e.target.closest(".menu"))return;
   if(anyCardMenuOpen())return;
   if(selectedLogIndex!=null){
     e.preventDefault();
     selectedLogIndex=null;
     render();
     return;
   }
   if(nominationPickSource){
     e.preventDefault();
     chooseNominationSource(p);
     return;
   }
   if(filterPickPlayer){
     e.preventDefault();
     filterLogByPlayer(p);
     return;
   }
   if(nominationSourceId){
     e.preventDefault();
     finishNomination(p);
     return;
   }
   if(votingTargetId){
     e.preventDefault();
     voteForNominee(p);
     return;
   }
   if(conversationSourceId){
     e.preventDefault();
     e.stopPropagation();
     toggleConversationTarget(p);
     return;
   }
 if(effectiveFieldLocked()){
     e.preventDefault();
     e.stopPropagation();
     closeAllMenus();
     startX=e.clientX;
     startY=e.clientY;
     moved=false;
     card.setPointerCapture(e.pointerId);
     return;
   }
   e.preventDefault();
   closeAllMenus();
   startX=e.clientX;
   startY=e.clientY;
   ox=p.x;
   oy=p.y;
   dragging=false;
   moved=false;
   card.setPointerCapture(e.pointerId);
 });

 card.addEventListener("pointermove",e=>{
   if(e.pointerType==="touch"&&activeTouchPointers.size>1){
     cancelAllCardGestures();
     cancelCardGesture(e.pointerId);
     return;
   }
   if(!card.hasPointerCapture(e.pointerId))return;
   const dx=e.clientX-startX;
   const dy=e.clientY-startY;
   const dist=Math.hypot(dx,dy);
   if(effectiveFieldLocked()){
     if(dist>MOVE_LIMIT)moved=true;
     return;
   }
   if(menu.style.display==="block")return;
   if(!dragging && dist>MOVE_LIMIT){
     dragging=true;
     moved=true;
     menu.style.display="none";
   }
   if(dragging)setPosition(ox+dx,oy+dy);
 });

 const finish=e=>{
   if(e.pointerType==="touch")activeTouchPointers.delete(e.pointerId);
   const hadCapture=card.hasPointerCapture(e.pointerId);
   if(!hadCapture)return;
   card.releasePointerCapture(e.pointerId);
  if(effectiveFieldLocked()){
     const dx=e.clientX-startX;
     const dy=e.clientY-startY;
     if(!isMainWorld()){
       if(!moved)openCardMenu(card,menu);
     }else if(dy<-SWIPE_LIMIT && Math.abs(dy)>Math.abs(dx)*1.4){
       openCardMenu(card,menu);
       openRoleEditor(p,menu);
     }else if(dy>SWIPE_LIMIT && Math.abs(dy)>Math.abs(dx)*1.4){
       startConversation(p);
     }else if(dx<-SWIPE_LIMIT && Math.abs(dx)>Math.abs(dy)*1.4){
       chooseNominationSource(p);
     }else if(dx>SWIPE_LIMIT && Math.abs(dx)>Math.abs(dy)*1.4){
       openCardMenu(card,menu);
       openConfirmedRoleEditor(p,menu);
     }else if(!moved){
       openCardMenu(card,menu);
     }
     moved=false;
     dragging=false;
     return;
   }
   if(dragging)save();
   dragging=false;
 };
 card.addEventListener("pointerup",finish);
 card.addEventListener("pointercancel",finish);
}

document.addEventListener("pointerdown",e=>{
 if(!e.target.closest(".menu"))closeAllMenus();
 if(!e.target.closest(".role-row"))closeRoleMenus();
 if(!e.target.closest(".person-row"))closePersonMenus();
});
render();
</script></body></html>
