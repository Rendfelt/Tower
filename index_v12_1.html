<style>

#field::after{content:"";position:absolute;inset:14px;border-radius:8px;background:radial-gradient(circle at 50% 0%,rgba(194,144,255,.16),transparent 24%),radial-gradient(circle at 18% 26%,rgba(157,77,204,.16),transparent 28%),radial-gradient(circle at 82% 38%,rgba(194,144,255,.1),transparent 26%),radial-gradient(circle at 42% 78%,rgba(114,38,158,.2),transparent 32%);box-shadow:inset 0 0 38px rgba(157,77,204,.1);pointer-events:none}

function dayBuckets(){

 let current=0;
 logs.forEach(log=>{
   if(log.type==="day"){current=Number.isFinite(log.day)?log.day:current+1;return;}
   if(!buckets.has(current))buckets.set(current,[]);
   buckets.get(current).push(log);

function voteCoincidenceMatrix(){
 const matrix=new Map();
 const add=(a,b)=>{
   if(a==null||b==null||a===b)return;
   const key=a<b?`${a}:${b}`:`${b}:${a}`;
   matrix.set(key,(matrix.get(key)||0)+1);
 };
 logs.forEach(log=>{
   if(log.type!=="nomination")return;
   const votes=[...new Set(log.votes||[])];
   for(let i=0;i<votes.length;i++)for(let j=i+1;j<votes.length;j++)add(votes[i],votes[j]);
   if(voteAgainstMode){
     const against=people.map(p=>p.id).filter(id=>!votes.includes(id));
     for(let i=0;i<against.length;i++)for(let j=i+1;j<against.length;j++)add(against[i],against[j]);
   }
 });
 return matrix;
}
function voteCoincidenceCount(matrix,a,b){
 if(a==null||b==null||a===b)return 0;
 const key=a<b?`${a}:${b}`:`${b}:${a}`;
 return matrix.get(key)||0;
}
function voteTopPeers(personId,matrix=voteCoincidenceMatrix(),limit=5){
 return people.filter(p=>p.id!==personId).map(p=>({person:p,count:voteCoincidenceCount(matrix,personId,p.id)}))
   .filter(item=>item.count>0)
   .sort((a,b)=>b.count-a.count||a.person.name.localeCompare(b.person.name,"ru"))
   .slice(0,limit);
}
function voteBestPeerCount(personId,matrix=voteCoincidenceMatrix()){

}
function voteFilterScoreMap(){
 const matrix=voteCoincidenceMatrix();
 const selected=voteFilterIds.filter(id=>people.some(p=>p.id===id));
 const scores=new Map();
 people.forEach(p=>{
   if(selected.includes(p.id))return;
   const total=voteTogetherMode&&selected.length
     ?logs.filter(log=>{
       if(log.type!=="nomination")return false;
       const group=[p.id,...selected];
       const votes=log.votes||[];
       return group.every(id=>votes.includes(id)) || (voteAgainstMode&&group.every(id=>!votes.includes(id)));
     }).length
     :selected.reduce((sum,id)=>sum+voteCoincidenceCount(matrix,id,p.id),0);
   if(total>0)scores.set(p.id,total);
 });
 return scores;
}

}

let speechQueue=[],speechQueueTimer=null,speechQueueDone=null,speechNext=null,speechCurrentItem=null,speechPaused=false,speechSuppressEnd=false,speechPlaybackMode="day",speechPlaybackDay=0,speechPlaybackLogs=[],speechPlaybackIndex=0,speechPlayerEntries=[],speechPlayerIndex=0,speechPlayerId=0;
function speakText(text,onend){
 if(!("speechSynthesis" in window)||!window.SpeechSynthesisUtterance)return;
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ru-RU";
 utterance.rate=.61;
 utterance.onend=()=>{if(!speechSuppressEnd&&onend)onend();};
 window.speechSynthesis.speak(utterance);
}
function speakQueue(items,onDone){
 if(!("speechSynthesis" in window))return;
 speechSuppressEnd=true;
 window.speechSynthesis.cancel();
 setTimeout(()=>{speechSuppressEnd=false;},0);
 if(speechQueueTimer)clearTimeout(speechQueueTimer);
 speechPaused=false;
 speechCurrentItem=null;
 speechQueueDone=onDone||null;
 speechQueue=items.slice();
 const next=()=>{
   if(speechPaused){speechNext=next;return;}
   const item=speechCurrentItem||speechQueue.shift();
   speechCurrentItem=item||null;
   if(!item){const done=speechQueueDone;speechQueueDone=null;if(done)done();return;}
   if(!item.text){speechCurrentItem=null;speechNext=next;speechQueueTimer=setTimeout(()=>{speechNext=null;next();},item.pause||900);return;}
   speakText(item.text,()=>{speechCurrentItem=null;speechNext=next;speechQueueTimer=setTimeout(()=>{speechNext=null;next();},item.pause||900);});
 };
 next();
}

}
function peopleWord(n){

}

function speechItemsForLog(log){
 if(log.type==="conversation")return [{text:`${playerName(log.sourceId)} общается с ${(log.targetIds||[]).map(playerName).join(", ")}`,pause:1300}];
 if(log.type==="death")return [{text:`${playerName(log.playerId)} ${log.dead?deathReasonText(log):"оживает"}`,pause:1300}];
 if(log.type==="dead-vote")return [{text:`${playerName(log.playerId)} использует мертвый голос за ${playerName(log.targetId)}`,pause:1300}];
 if(log.type==="custom")return [{text:log.text||"",pause:1300}];
 if(log.type==="nomination"){
   const source=playerName(log.sourceId);
   const target=playerName(log.targetId);
   const votes=(log.votes||[]).map(playerName);
   const items=[{text:`${source} номинирует ${target}`,pause:1100}];
   items.push({text:`За ${target} ${voteCountPhrase(votes.length)}`,pause:650});
   votes.forEach(name=>items.push({text:name,pause:650}));
   return items;
 }
 return [{text:logText(log),pause:1300}];
}
function prepareSpeechDay(day){
 speechPlaybackMode="day";
 speechPlaybackDay=day;

}
function playSpeechLog(index,withIntro=false){
 if(!speechPlaybackDay){speakQueue([{text:"День еще не начался.",pause:0}]);return;}
 if(!speechPlaybackLogs.length){speakQueue([{text:`День ${speechPlaybackDay}. Событий пока нет.`,pause:0}]);return;}
 const beforeStart=index<0;
 const afterEnd=index>=speechPlaybackLogs.length;
 if(beforeStart){speakQueue([{text:"Начало дня",pause:0}]);return;}
 if(afterEnd){speakQueue([{text:"Конец дня",pause:0}]);return;}
 speechPlaybackIndex=Math.min(Math.max(0,index),speechPlaybackLogs.length-1);
 const items=[];
 if(withIntro)items.push({text:`История дня ${speechPlaybackDay}`,pause:1200});
 items.push(...speechItemsForLog(speechPlaybackLogs[speechPlaybackIndex]),{text:"",pause:600});
 speakQueue(items,()=>{
   if(speechPlaybackIndex<speechPlaybackLogs.length-1)playSpeechLog(speechPlaybackIndex+1);
 });
}

function separateStatCards(){
 if(!isDeathOnlyWorld())return;
 const gap=20;
 const wallGap=10;
 const sourceSize=1000;
 const cards=[...field.querySelectorAll(".card")].map(card=>{
   const person=people.find(p=>p.id===+card.dataset.id);
   if(!person)return null;
   const item={card,person,x:person.x||0,y:person.y||0,w:card.offsetWidth,h:card.offsetHeight};
   const distances=[
     {wall:"left",value:item.x},
     {wall:"right",value:sourceSize-(item.x+item.w)},
     {wall:"top",value:item.y},
     {wall:"bottom",value:sourceSize-(item.y+item.h)}
   ];
   item.wall=distances.sort((a,b)=>a.value-b.value)[0].wall;
   item.axis=(item.wall==="left"||item.wall==="right")?"y":"x";
   return item;
 }).filter(Boolean);
 ["left","right","top","bottom"].forEach(wall=>{
   const group=cards.filter(item=>item.wall===wall).sort((a,b)=>wall==="left"||wall==="right"?a.y-b.y:a.x-b.x);
   if(!group.length)return;
   const vertical=wall==="left"||wall==="right";
   const total=group.reduce((sum,item)=>sum+(vertical?item.h:item.w),0)+gap*(group.length-1);
   const limit=vertical?field.clientHeight:field.clientWidth;
   let pos=Math.max(wallGap,(limit-total)/2);
   group.forEach(item=>{
     const x=wall==="left"?wallGap:wall==="right"?Math.max(0,field.clientWidth-item.w-wallGap):pos;
     const y=wall==="top"?wallGap:wall==="bottom"?Math.max(0,field.clientHeight-item.h-wallGap):pos;
     item.card.style.left=Math.min(Math.max(0,x),Math.max(0,field.clientWidth-item.w))+"px";
     item.card.style.top=Math.min(Math.max(0,y),Math.max(0,field.clientHeight-item.h))+"px";
     pos+=(vertical?item.h:item.w)+gap;
   });
 });
}

function setupSpeechSurface(){
 const surface=$("speechSurface");
 if(!surface||surface._ready)return;
 surface._ready=true;
 let startX=0,startY=0,longTimer=null,longDone=false;
 const clearLong=()=>{if(longTimer)clearTimeout(longTimer);longTimer=null;};
 surface.addEventListener("pointerdown",e=>{
   if(e.pointerType==="touch"&&activeTouchPointers.size>1)return;
   e.preventDefault();
   startX=e.clientX;
   startY=e.clientY;
   longDone=false;
   surface.setPointerCapture(e.pointerId);
   clearLong();
   longTimer=setTimeout(()=>{
     longDone=true;
     const rect=surface.getBoundingClientRect();
     shiftSpeechDay(e.clientX<rect.left+rect.width/2?-1:1);
   },650);
 });
 surface.addEventListener("pointermove",e=>{
   if(Math.hypot(e.clientX-startX,e.clientY-startY)>18)clearLong();
 });
 const finish=e=>{
   clearLong();
   if(surface.hasPointerCapture(e.pointerId))surface.releasePointerCapture(e.pointerId);
   if(longDone)return;
   const dx=e.clientX-startX;
   const dy=e.clientY-startY;
   if(dy<-55&&Math.abs(dy)>Math.abs(dx)*1.4)toggleSpeechPause();
   else if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)shiftSpeechLog(dx<0?-1:1);
 };
 surface.addEventListener("pointerup",finish);
 surface.addEventListener("pointercancel",e=>{
   clearLong();
   if(surface.hasPointerCapture(e.pointerId))surface.releasePointerCapture(e.pointerId);
 });
}

     const before=source[idx-1]||"";

     out+=source.slice(pos,idx);

 };

 unconfirmBtn.onclick=()=>{removeConfirmedRole(person);closeAllMenus();};
 if(isMainWorld()){
   let filterBtn=document.createElement("button");
   filterBtn.textContent="Фильтровать";
   filterBtn.onclick=()=>filterLogByPlayer(person);
   let timelineBtn=document.createElement("button");
   timelineBtn.textContent="Лента";
   timelineBtn.onclick=()=>showPlayerTimeline(person);
   let deadBtn=document.createElement("button");
   deadBtn.textContent=person.dead?"Сделать живым":"Сделать мертвым";
   deadBtn.onclick=()=>person.dead?toggleDead(person):openDeathEditor(person,menu);
   menu.append(filterBtn,timelineBtn,deadBtn,colorBtn,iconBtn,unconfirmBtn);
 }else{
   menu.append(confirmBtn,unconfirmBtn,colorBtn,iconBtn);
 }
}

function setPlayerColor(person,color){
 person.color=color;
 save();
 render();
}

function openDeathEditor(person,menu){
 menu.innerHTML="";
 [["executed","Казнен"],["night","Ночью"],["unclear","Неясно"],["ability","Способность"]].forEach(([reason,title])=>{
   let b=document.createElement("button");
   b.textContent=title;
   b.onclick=()=>reason==="ability"?openDeathAbilityEditor(person,menu):toggleDead(person,reason);
   menu.append(b);
 });
 let back=document.createElement("button");
 back.textContent="Назад";
 back.onclick=()=>fillCardMenu(person,menu);
 menu.append(back);
 fitCardMenu(menu._card,menu);
}

function openDeathAbilityEditor(person,menu){
 menu.innerHTML="";
 roles.forEach(role=>{
   let b=document.createElement("button");
   b.textContent=role.name;
   b.onclick=()=>toggleDead(person,"ability",{id:role.id,name:role.name});
   menu.append(b);
 });
 let custom=document.createElement("input");
 custom.placeholder="Вписать роль";
 let apply=document.createElement("button");
 apply.textContent="Применить";
 apply.onclick=()=>{
   const name=custom.value.trim();
   if(name)toggleDead(person,"ability",{name});
 };
 menu.append(custom,apply);
 let back=document.createElement("button");
 back.textContent="Назад";
 back.onclick=()=>openDeathEditor(person,menu);
 menu.append(back);
 fitCardMenu(menu._card,menu);
}

function openColorEditor(person,menu){
 menu.innerHTML="";
 [["blue","Базовый"],["cyan","Синий"],["red","Красный"],["green","Зеленый"],["yellow","Желтый"]].forEach(([color,title])=>{
   let b=document.createElement("button");
   b.textContent=(person.color===color?"✓ ":"")+title;
   b.onclick=()=>setPlayerColor(person,color);
   menu.append(b);
 });
 let back=document.createElement("button");
 back.textContent="Назад";
 back.onclick=()=>fillCardMenu(person,menu);
 menu.append(back);
 fitCardMenu(menu._card,menu);
}

function setPlayerIcon(person,icon,enabled){
 const icons=person.icons||[];
 person.icons=enabled?[...new Set([...icons,icon])]:icons.filter(value=>value!==icon);
 save();
 refreshRoleViews();
}

function openIconEditor(person,menu){
 menu.innerHTML="";
 [["heart","❤ Сердечко"],["eye","👁️ Глаз"],["cross","✕ Красный косой крест"],["smile","🙂 Смайлик"]].forEach(([icon,title])=>{
   let label=document.createElement("label");
   label.className="icon-check";
   let cb=document.createElement("input");
   cb.type="checkbox";
   cb.checked=(person.icons||[]).includes(icon);
   cb.onchange=()=>setPlayerIcon(person,icon,cb.checked);
   label.append(cb,document.createTextNode(title));
   menu.append(label);
 });
 fitCardMenu(menu._card,menu);
}

function openRoleEditor(person,menu){
 menu.innerHTML="";
 menu.classList.add("role-choice-menu");
 let grid=document.createElement("div");
 grid.className="role-choice-grid";
 menu.append(grid);
 forEachRoleByType((r)=>{
   if(!r){
     let sep=document.createElement("div");
     sep.className="role-type-separator";
     grid.append(sep);
     return;
   }
   let l=document.createElement("label");
   l.className="role-check";
   let c=document.createElement("input");
   c.type="checkbox";
   c.checked=person.roles.includes(r.id);
   c.value=r.id;
   c.onchange=()=>{
     person.roles=[...menu.querySelectorAll("input:checked")].map(x=>+x.value);
     person.confirmedRoles=(person.confirmedRoles||[]).filter(id=>person.roles.includes(id));
     save();
     refreshRoleViews();
   };
   l.append(c," ",r.name);
   grid.append(l);
 });
 fitCardMenu(menu._card,menu);
}


function openConfirmedRoleEditor(person,menu){
 menu.innerHTML="";
 menu.classList.add("role-choice-menu");
 if(!roles.length){
   let empty=document.createElement("div");
   empty.textContent="Нет ролей";
   menu.append(empty);
 }
 let grid=document.createElement("div");
 grid.className="role-choice-grid";
 menu.append(grid);
 forEachRoleByType((r)=>{
   if(!r){
     let sep=document.createElement("div");
     sep.className="role-type-separator";
     grid.append(sep);
     return;
   }
   let b=document.createElement("button");
   const takenByOther=roleConfirmedByOther(person,r.id);
   const selectedByPerson=(person.confirmedRoles||[]).includes(r.id);
   const unconfirmedAssigned=person.roles.includes(r.id)&&!selectedByPerson;
   b.className="role-check";
   b.disabled=takenByOther;
   b.innerHTML=selectedByPerson?`<span class="confirmed-mark">✓</span> ${esc(r.name)}`:unconfirmedAssigned?`✓ ${esc(r.name)}`:takenByOther?`${esc(r.name)} — занята`:esc(r.name);
   b.onclick=()=>{
     if(takenByOther)return;
     setConfirmedRole(person,r.id);
     closeAllMenus();
   };
   grid.append(b);
 });
 fitCardMenu(menu._card,menu);
}
function setupCardInteractions(card,menu,p){
 const MOVE_LIMIT=8;
 const SWIPE_LIMIT=42;
 let dragging=false,moved=false,startX=0,startY=0,ox=0,oy=0;
 const cancelCardGesture=pointerId=>{
   if(card.hasPointerCapture(pointerId))card.releasePointerCapture(pointerId);
   dragging=false;
   moved=false;
 };
 const setPosition=(x,y)=>{
   const maxX=Math.max(0,field.clientWidth-card.offsetWidth);
   const maxY=Math.max(0,field.clientHeight-card.offsetHeight);
   p.x=Math.min(Math.max(0,x),maxX);
   p.y=Math.min(Math.max(0,y),maxY);
   card.style.left=p.x+"px";
   card.style.top=p.y+"px";
 };

 card.addEventListener("contextmenu",e=>{
   e.preventDefault();
   if(isVotesWorld())return;
   if(!effectiveFieldLocked())return;
   e.stopPropagation();
   openCardMenu(card,menu);
 });

 card.addEventListener("pointerdown",e=>{
   if(e.pointerType==="touch"){
     activeTouchPointers.add(e.pointerId);
     if(activeTouchPointers.size>1){
       cancelAllCardGestures();
       cancelCardGesture(e.pointerId);
       return;
     }
   }
   if(e.button!==0 || e.target.closest(".menu"))return;
  if(anyCardMenuOpen())return;
   if(isVotesWorld()){
     e.preventDefault();
     e.stopPropagation();
     startX=e.clientX;
     startY=e.clientY;
     moved=false;
     card.setPointerCapture(e.pointerId);
     return;
   }
   if(selectedLogIndex!=null){
     e.preventDefault();
     selectedLogIndex=null;
     render();
     return;
   }
   if(nominationPickSource){
     e.preventDefault();
     chooseNominationSource(p);
     return;
   }
   if(filterPickPlayer){
     e.preventDefault();
     filterLogByPlayer(p);
     return;
   }
   if(nominationSourceId){
     e.preventDefault();
     finishNomination(p);
     return;
   }
   if(votingTargetId){
     e.preventDefault();
     e.stopPropagation();
     if(p.dead&&p.deadVoteUsed)return;
     voteForNominee(p);
     return;
   }
   if(conversationSourceId){
     e.preventDefault();
     e.stopPropagation();
     toggleConversationTarget(p);
     return;
   }
 if(effectiveFieldLocked()){
     e.preventDefault();
     e.stopPropagation();
     closeAllMenus();
     startX=e.clientX;
     startY=e.clientY;
     moved=false;
     card.setPointerCapture(e.pointerId);
     return;
   }
   e.preventDefault();
   closeAllMenus();
   startX=e.clientX;
   startY=e.clientY;
   ox=p.x;
   oy=p.y;
   dragging=false;
   moved=false;
   card.setPointerCapture(e.pointerId);
 });

 card.addEventListener("pointermove",e=>{
   if(e.pointerType==="touch"&&activeTouchPointers.size>1){
     cancelAllCardGestures();
     cancelCardGesture(e.pointerId);
     return;
   }
   if(!card.hasPointerCapture(e.pointerId))return;
   const dx=e.clientX-startX;
   const dy=e.clientY-startY;
   const dist=Math.hypot(dx,dy);
   if(effectiveFieldLocked()){
     if(dist>MOVE_LIMIT)moved=true;
     return;
   }
   if(menu.style.display==="block")return;
   if(!dragging && dist>MOVE_LIMIT){
     dragging=true;
     moved=true;
     menu.style.display="none";
   }
   if(dragging)setPosition(ox+dx,oy+dy);
 });

 const finish=e=>{
   if(e.pointerType==="touch")activeTouchPointers.delete(e.pointerId);
   const hadCapture=card.hasPointerCapture(e.pointerId);
   if(!hadCapture)return;
   card.releasePointerCapture(e.pointerId);
  if(votingTargetId){
     moved=false;
     dragging=false;
     return;
   }
  if(effectiveFieldLocked()){
     const dx=e.clientX-startX;
     const dy=e.clientY-startY;
     if(isVotesWorld()){
       if(dy<-SWIPE_LIMIT && Math.abs(dy)>Math.abs(dx)*1.4)addVoteFilter(p);
       else if(dy>SWIPE_LIMIT && Math.abs(dy)>Math.abs(dx)*1.4)removeVoteFilter(p);
       moved=false;
       dragging=false;
       return;
     }
     if(!isMainWorld()){
       if(!moved)openCardMenu(card,menu);
     }else if(dy<-SWIPE_LIMIT && Math.abs(dy)>Math.abs(dx)*1.4){
       openCardMenu(card,menu);
       openRoleEditor(p,menu);
     }else if(dy>SWIPE_LIMIT && Math.abs(dy)>Math.abs(dx)*1.4){
       startConversation(p);
     }else if(dx<-SWIPE_LIMIT && Math.abs(dx)>Math.abs(dy)*1.4){
       chooseNominationSource(p);
     }else if(dx>SWIPE_LIMIT && Math.abs(dx)>Math.abs(dy)*1.4){
       openCardMenu(card,menu);
       openConfirmedRoleEditor(p,menu);
     }else if(!moved){
       openCardMenu(card,menu);
     }
     moved=false;
     dragging=false;
     return;
   }
   if(dragging)save();
   dragging=false;
 };
 card.addEventListener("pointerup",finish);
 card.addEventListener("pointercancel",finish);
}

document.addEventListener("pointerdown",e=>{
 if(!e.target.closest(".menu")&&anyCardMenuOpen()){
   e.preventDefault();
   e.stopPropagation();
   closeAllMenus();
   return;
 }
},true);
document.addEventListener("pointerdown",e=>{
 if(!e.target.closest(".role-row"))closeRoleMenus();
 if(!e.target.closest(".person-row"))closePersonMenus();
});
document.querySelector(".system-panel")?.addEventListener("toggle",()=>{
 closeAllMenus();
 render();
});
setupSpeechSurface();
render();
</script></body></html>
